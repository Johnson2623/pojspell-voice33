<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>白話字拼讀寫閃卡練習器 李香恩</title>
<style>
  :root {
    --bg: #f8f5f0;
    --card-bg: #ffffff;
    --primary: #1e4d6b;
    --primary-soft: #e6f0f7;
    --syl1-color: #2b6cb0;
    --syl1-bg: #ebf8ff;
    --syl2-color: #2f855a;
    --syl2-bg: #f0fff4;
    --syl3-color: #9c4221;
    --syl3-bg: #fffaf0;
    --syl48-color: #b83280;
    --syl48-bg: #fff5f7;
    --accent: #c05621;
    --accent-soft: #feebc8;
    --neutral-color: #6b46c1;
    --neutral-bg: #faf5ff;
    --text: #2d2622;
    --text-muted: #6b625c;
    --border: #e0d7cc;
    --success: #276749;
    --danger: #c53030;
    --poj-font: "Charis SIL", "Doulos SIL", "Gentium Plus", "Noto Sans", "Segoe UI", Roboto, sans-serif;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    padding: 10px;
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--poj-font);
    line-height: 1.55;
  }

  /* 總寬度增加 30%（860px -> 1118px） */
  .app-shell {
    max-width: 1118px;
    margin: 0 auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(30, 77, 107, 0.08);
    overflow: hidden;
  }

  /* 第一列：音節數分類主導覽列（5欄，最右側含「第4,8音字詞」） */
  .syllable-bar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding: 12px 14px;
    background: #f1ebe2;
    border-bottom: 1px solid var(--border);
  }
  .syl-btn {
    border: 2px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 9px 8px;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    transition: all 0.18s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .syl-btn .syl-title {
    font-size: 1.38rem;
    font-weight: 700;
  }
  .syl-btn .syl-desc {
    font-size: 0.73rem;
    color: var(--text-muted);
  }
  .syl-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 3px 10px rgba(30, 77, 107, 0.22);
  }
  .syl-btn.active .syl-desc {
    color: rgba(255, 255, 255, 0.85);
  }

  /* 第二列：靠左放置經卷欄位與模式切換選項 */
  .control-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: #faf7f2;
    border-bottom: 1px solid var(--border);
  }
  .view-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .view-tab {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.86rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .view-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* 「名詞」、「動詞」、「形容詞」三個欄位：
     寬度同「詞庫總覽」（約 110px），底色與文字顏色同第二列「辨識測驗」（#fff 底、var(--text) 字色） */
  .book-tab {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.86rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    min-width: 110px;
  }

  .book-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-left: auto;
  }
  .select-box {
    padding: 5px 9px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: #fff;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
  }

  /* Main Workspace */
  .workspace {
    padding: 14px 16px;
  }
  .hidden {
    display: none !important;
  }

  /* 第三列：左側功能與出處章節 ＋ 最右側調整速度 */
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .progress-badge {
    background: var(--primary-soft);
    color: var(--primary);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 0.84rem;
    font-weight: 700;
  }
  .mini-btns {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .mini-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 5px 10px;
    border-radius: 7px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }
  .mini-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  .verse-tag {
    background: #f0eae1;
    color: #5a5048;
    padding: 5px 11px;
    border-radius: 7px;
    font-size: 0.84rem;
    font-weight: 700;
  }

  /* 第四列（最下方閃卡欄位）：高度減少 50% (295px -> 148px) */
  .flashcard-box {
    background: #fffdf9;
    border: 2px solid var(--border);
    border-radius: 16px;
    min-height: 148px;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    user-select: none;
  }
  .flashcard-box:hover {
    border-color: var(--primary);
    box-shadow: 0 6px 18px rgba(30, 77, 107, 0.12);
  }

  /* 閃卡中央同時顯示「漢字」與「白話字」 */
  .card-front-area {
    text-align: center;
    margin: 4px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .big-word {
    font-size: 2.15rem;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.25;
  }
  .sub-word {
    font-size: 2.05rem;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.25;
  }

  /* Back of Flashcard (點擊後展開補充解析) */
  .card-back-area {
    border-top: 1px dashed var(--border);
    padding-top: 12px;
    margin-top: 8px;
    text-align: center;
    animation: slideUp 0.22s ease;
  }

  /* Syllable Breakdown Chips */
  .syllable-chips {
    display: flex;
    justify-content: center;
    align-items: stretch;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .syl-chip {
    background: #fff;
    border: 1.5px solid #d4c8b8;
    border-radius: 10px;
    padding: 5px 10px;
    min-width: 88px;
    text-align: center;
  }
  .syl-chip.sandhi {
    border-color: #d69e2e;
    background: #fffff0;
  }
  .syl-chip.base {
    border-color: #2b6cb0;
    background: #f7fafc;
  }
  .syl-chip.neutral {
    border-color: #805ad5;
    background: var(--neutral-bg);
  }
  .chip-poj {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
  }
  .chip-hanzi {
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .chip-rule {
    display: inline-block;
    margin-top: 2px;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 700;
  }
  .sandhi .chip-rule { background: #fefcbf; color: #975a16; }
  .base .chip-rule { background: #bee3f8; color: #2c5282; }
  .neutral .chip-rule { background: #e9d8fd; color: #553c9a; }

  .card-tip-note {
    display: inline-block;
    background: #f4efe8;
    color: #4a413b;
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 0.84rem;
    margin-bottom: 8px;
  }

  .verse-context-box {
    background: var(--primary-soft);
    border-left: 4px solid var(--primary);
    padding: 8px 12px;
    border-radius: 0 8px 8px 0;
    text-align: left;
    font-size: 0.86rem;
  }
  .verse-context-box .vc-hanzi {
    font-weight: 700;
    color: var(--text);
    margin-bottom: 2px;
  }
  .verse-context-box .vc-poj {
    color: var(--primary);
    font-weight: 600;
  }
  .hl-word {
    background: #fef08a;
    color: #9a3412;
    padding: 0 4px;
    border-radius: 4px;
    font-weight: 700;
  }

  /* Quiz Mode */
  .quiz-box {
    background: #fffdf9;
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 14px 18px;
  }
  .quiz-target-hanzi {
    text-align: center;
    font-size: 1.85rem;
    font-weight: 700;
    color: var(--primary);
    margin: 8px 0 14px 0;
  }
  .quiz-options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 10px;
  }
  .q-opt {
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: #fff;
    font-family: var(--poj-font);
    font-size: 1.12rem;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .q-opt:hover:not(:disabled) {
    border-color: var(--primary);
    background: var(--primary-soft);
  }
  .q-opt.correct {
    background: #e6fffa;
    border-color: var(--success);
    color: var(--success);
  }
  .q-opt.wrong {
    background: #fff5f5;
    border-color: var(--danger);
    color: var(--danger);
  }
  .quiz-feedback {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.88rem;
  }
  .quiz-feedback.ok { background: #e6fffa; border: 1px solid #9ae6b4; color: #22543d; }
  .quiz-feedback.err { background: #fff5f5; border: 1px solid #feb2b2; color: #742a2a; }

  /* Grid Overview Mode：4 欄漢羅左右並排，且顯示列高度減少 2/3 */
  .grid-list {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    max-height: 380px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .grid-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 14px;
    min-height: 32px;
    background: #fffdf9;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 18px;
    line-height: 1.25;
  }
  .grid-hanzi {
    font-size: 1.08rem;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
  }
  .grid-poj {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }
  .masked {
    filter: blur(5px);
    cursor: pointer;
    user-select: none;
  }
  .masked:hover {
    filter: blur(0);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 820px) {
    .grid-list {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 640px) {
    .syllable-bar {
      grid-template-columns: repeat(2, 1fr);
    }
    .big-word, .sub-word { font-size: 1.75rem; }
    .grid-list {
      grid-template-columns: 1fr;
    }
  }

  /* 閃卡聲調符號：使用透明背景的 POJ 圖檔，與原 0.7rem 字體等高 */
  .tone-symbol { display:inline-block; height:0.7rem; width:auto; max-width:1.15rem; vertical-align:-0.06em; object-fit:contain; }

/* iPhone 15 Plus (430 CSS px) 專用直立響應式排版；其他功能及字詞資料不變 */
@media (max-width: 600px) {
 html { width:100%; -webkit-text-size-adjust:100%; }
 body { width:100%; margin:0; padding:4px; overflow-x:hidden; }
 .app-shell { width:100%; max-width:100%; min-width:0; border-radius:10px; }
 .syllable-bar { grid-template-columns:repeat(5,minmax(0,1fr)); gap:3px; padding:7px 5px; }
 .syl-btn { min-width:0; padding:8px 1px; border-width:1px; border-radius:7px; min-height:49px; }
 .syl-btn .syl-title { font-size:clamp(15px,3.975vw,19.5px); line-height:1.22; overflow-wrap:anywhere; }
 .syl-btn .syl-desc { font-size:10px; }
 .control-bar { display:block; padding:7px 5px; }
 .view-tabs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; width:100%; }
 .view-tab,.book-tab,.view-tab[style] { width:100%; min-width:0 !important; min-height:39px; padding:7px 2px; font-size:clamp(12px,3vw,14px); line-height:1.2; white-space:normal; }
 .workspace { padding:9px 7px; min-width:0; }
 .status-row { display:flex; flex-direction:column; align-items:stretch; gap:7px; margin-bottom:10px; }
 .mini-btns { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; width:100%; }
 .mini-btn { min-width:0; min-height:38px; padding:7px 3px; line-height:1.25; font-size:clamp(11px,2.8vw,13px); white-space:normal; }
 .verse-tag { grid-column:1/-1; text-align:center; }
 .filter-group { width:100%; justify-content:center; margin:0; gap:6px; }
 .filter-group select { max-width:100%; }
 .select-box { min-height:36px; font-size:14px; }
 .flashcard-box { width:100%; min-width:0; min-height:175px; padding:12px 8px; border-radius:11px; }
 .card-front-area { width:100%; min-width:0; gap:9px; }
 .big-word,.sub-word { font-size:clamp(26px,8vw,38px); max-width:100%; overflow-wrap:anywhere; text-align:center; }
 .card-back-area { max-width:100%; min-width:0; overflow-wrap:anywhere; }
 .syllable-chips { gap:5px; }
 .syl-chip { min-width:0; max-width:100%; padding:5px 7px; }
 .verse-context-box { overflow-wrap:anywhere; }
 .quiz-box { padding:12px 8px; }
 .quiz-options { grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
 .q-opt { min-width:0; min-height:56px; padding:8px 4px; font-size:clamp(14px,3.8vw,18px); overflow-wrap:anywhere; }
 .quiz-target-hanzi { font-size:clamp(26px,8vw,36px); }
 .grid-list { grid-template-columns:1fr; max-height:60vh; padding-right:2px; }
 .grid-card { min-width:0; gap:10px; padding:8px 10px; }
 .grid-hanzi { flex:0 0 auto; white-space:normal; }
 .grid-poj { min-width:0; white-space:normal; overflow-wrap:anywhere; }
 button,select { touch-action:manipulation; }
}


/* 第二至第六列：欄位名稱較舊版放大 40%；第一列字級維持 */
.control-bar .view-tab, .control-bar .book-tab { font-size: 1.204rem; }
.workspace .mini-btn { font-size: 1.148rem; }
.workspace .verse-tag, .workspace .progress-badge { font-size: 1.176rem; }
.workspace .filter-group label { font-size: 1.176rem !important; }
.workspace .select-box { font-size: 1.19rem; }
.workspace button:not(.mini-btn):not(.q-opt) { font-size: 1.18rem; }
/* iPhone 15 Plus：使用自動換行與適度留白，避免大字擠出畫面 */
@media (max-width:600px) {
 .view-tab,.book-tab,.view-tab[style] { font-size:clamp(16.8px,4.2vw,19.6px); overflow-wrap:anywhere; min-height:50px; padding:8px 2px; }
 .mini-btn { font-size:clamp(15.4px,3.92vw,18.2px); min-height:49px; padding:8px 3px; overflow-wrap:anywhere; }
 .workspace .verse-tag,.workspace .progress-badge { font-size:1.176rem; overflow-wrap:anywhere; }
 .workspace .filter-group label { font-size:1.176rem !important; }
 .workspace .select-box { font-size:19.6px; min-height:45px; }
 .workspace button:not(.mini-btn):not(.q-opt) { overflow-wrap:anywhere; }
}


/* 辨識測驗：題數統計右側直接顯示重洗牌，不再獨占下一列 */
#view-quiz .mini-btns { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:stretch; column-gap:0; row-gap:6px; width:100%; }
#view-quiz #qz-status { min-width:0; width:100%; box-sizing:border-box; white-space:normal; text-align:center; display:flex; align-items:center; justify-content:center; border-radius:7px 0 0 7px; }
#view-quiz .quiz-reshuffle { min-width:0; width:100%; box-sizing:border-box; white-space:normal; padding-inline:5px; border-radius:0 7px 7px 0; }
#view-quiz #qz-verse { grid-column:1 / -1; }
@media(max-width:600px) {
 #view-quiz .mini-btns { grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:0; row-gap:5px; }
 #view-quiz #qz-status { padding:7px 3px; font-size:clamp(13px,3.6vw,16px); }
 #view-quiz .quiz-reshuffle { font-size:clamp(14px,3.8vw,17px); min-height:44px; padding:6px 7px; }
}

/* 辨識測驗頁面：中文下方的白話字選項字形放大 50%，不影響其他頁面。 */
#view-quiz .quiz-options .q-opt { font-size: 1.68rem; line-height: 1.3; overflow-wrap: anywhere; }
@media (max-width: 600px) {
  #view-quiz .quiz-options .q-opt { font-size: clamp(21px, 5.7vw, 27px); min-height: 64px; }
}

/* 辨識測驗：章節與速度選單並排各 50%（保留上排題數與重洗牌） */
#view-quiz .status-row { display:block; }
#view-quiz .mini-btns { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px 0; width:100%; }
#view-quiz #qz-verse { grid-column:1; width:100%; min-width:0; box-sizing:border-box; display:flex; align-items:center; justify-content:center; text-align:center; margin:0; white-space:normal; border-radius:7px 0 0 7px; }
#view-quiz .filter-group { grid-column:2; width:100%; min-width:0; box-sizing:border-box; margin:0; padding:5px 4px; display:flex; justify-content:center; align-items:center; gap:4px; flex-wrap:nowrap; border:1px solid var(--border); border-radius:0 7px 7px 0; }
#view-quiz .filter-group label { flex:0 1 auto; white-space:nowrap; font-size:clamp(12px,3.1vw,16px) !important; }
#view-quiz .filter-group select { min-width:0; max-width:65px; width:auto; flex:0 1 auto; padding:5px 2px; font-size:clamp(12px,3.1vw,16px) !important; }


/* 詞庫總覽：兩列獨立配置，避免手機版預設的 .status-row / .mini-btns 干擾 */
#view-grid .grid-overview-top { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); width:100%; gap:0; align-items:stretch; margin-bottom:7px; }
#view-grid #grid-count { box-sizing:border-box; width:100%; min-width:0; display:flex; align-items:center; justify-content:center; text-align:center; white-space:normal; margin:0; padding:7px 4px; border-radius:8px 0 0 8px; font-size:clamp(12px,3.3vw,18px); line-height:1.35; }
#view-grid .grid-overview-top .filter-group { box-sizing:border-box; width:100%; min-width:0; margin:0; padding:6px 3px; display:flex; flex-wrap:nowrap; align-items:center; justify-content:center; gap:3px; border:1px solid var(--border); border-radius:0 8px 8px 0; }
#view-grid .grid-overview-top .filter-group label { white-space:nowrap; font-size:clamp(18px,4.5vw,25.5px) !important; }
#view-grid .grid-overview-top .filter-group select { width:auto; max-width:64px; min-width:0; min-height:38px; padding:4px 2px; font-size:clamp(12px,3vw,17px) !important; }
#view-grid .grid-overview-masks { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; width:100%; margin-bottom:10px; }
#view-grid .grid-overview-masks .mini-btn { box-sizing:border-box; width:100%; min-width:0; margin:0; padding:8px 2px; display:flex; justify-content:center; align-items:center; text-align:center; white-space:normal; overflow-wrap:anywhere; line-height:1.3; font-size:clamp(15px,3.975vw,19.5px); }

const POJ_AUDIO_BY_FILENAME = new Map();
const POJ_AUDIO_EMBEDDED = null;
let pojCurrentAudio = null;
let pojAudioUrl = null;
function pojAudioStatus(message) {
  const el = document.getElementById('poj-audio-status');
  if (el) el.textContent = message;
}
function pojAudioNameKey(value) {
  return String(value || '').split(/[\\/]/).pop().normalize('NFC').toLowerCase();
}
function importPOJAudioFiles(fileList) {
  let count = 0;
  for (const file of Array.from(fileList || [])) {
    if (!/\.(mp3|wav)$/i.test(file.name)) continue;
    POJ_AUDIO_BY_FILENAME.set(pojAudioNameKey(file.name), file);
    count++;
  }
  pojAudioStatus(count ? `已載入 ${POJ_AUDIO_BY_FILENAME.size} 個音檔；點擊各字詞的 ▶ 聆聽。` : '尚未找到 MP3/WAV 檔，請選取解壓縮後的教育部音檔。');
}
async function playPOJItemAudio(item, event) {
  if (event) event.stopPropagation();
  if (!item) return;
  const id = String(item.entryId || '').trim();
  const stem = POJ_AUDIO_STEMS[id];
  if (!stem) {pojAudioStatus(`「${item.hanzi}」缺少教育部音檔編號，尚不能播放。`);return;}
  if (pojCurrentAudio) {pojCurrentAudio.pause();pojCurrentAudio = null;}
  if (pojAudioUrl) {URL.revokeObjectURL(pojAudioUrl);pojAudioUrl = null;}
  const bases = [...new Set([stem, id+'(1)', id])];
  const candidates = [];
  for (const base of bases) for (const ext of ['mp3','wav']) candidates.push(base+'.'+ext);
  const picked = candidates.map(n => POJ_AUDIO_BY_FILENAME.get(pojAudioNameKey(n))).find(Boolean);
  let urls = [];
  if (picked) {pojAudioUrl = URL.createObjectURL(picked);urls = [pojAudioUrl];}
  else urls = candidates.map(n => 'audio/'+encodeURIComponent(n));
  pojAudioStatus(`正在載入「${item.hanzi}」的例音…`);
  for (const url of urls) {
    const player = new Audio();
    player.preload = 'auto';
    player.src = url;
    pojCurrentAudio = player;
    try {
      await player.play();
      pojAudioStatus(`正在播放：${item.hanzi}（${stem}）`);
      player.addEventListener('ended', () => {if (pojCurrentAudio===player) pojAudioStatus(`播放完成：${item.hanzi}`);}, {once:true});
      return;
    } catch (err) {
      player.pause();
      if (err && err.name === 'NotAllowedError') {pojAudioStatus('瀏覽器阻擋播放，請再次點擊 ▶ 聆聽。');return;}
    }
  }
  pojAudioStatus(`找不到「${item.hanzi}」的音檔 ${stem}.mp3；請確認 audio/ 資料夾與 index.html 位於同一層。`);
}

  {"syl": 1, "verse": "辭庫", "hanzi": "換", "poj": "oāⁿ", "distractors": ["kè", "soàn", "soán"], "note": "變更、對調。", "vHanzi": "換", "vPoj": "oāⁿ", "entryId": "8406"},
  {"syl": 1, "verse": "辭庫", "hanzi": "計", "poj": "kè", "distractors": ["soàn", "soán", "kéng"], "note": "計算、合計。\n爭論、較量。", "vHanzi": "計", "vPoj": "kè", "entryId": "5492"},
  {"syl": 1, "verse": "辭庫", "hanzi": "算", "poj": "soàn", "distractors": ["soán", "kéng", "kái"], "note": "設想、推測。\n謀畫。", "vHanzi": "算", "vPoj": "soàn", "entryId": "10685"},
  {"syl": 1, "verse": "辭庫", "hanzi": "選", "poj": "soán", "distractors": ["kéng", "kái", "jīn"], "note": "挑取、選擇。", "vHanzi": "選", "vPoj": "soán", "entryId": "11949"},
  {"syl": 1, "verse": "辭庫", "hanzi": "揀", "poj": "kéng", "distractors": ["kái", "jīn", "chhâ"], "note": "挑、選。", "vHanzi": "揀", "vPoj": "kéng", "entryId": "8351"},
  {"syl": 1, "verse": "辭庫", "hanzi": "改", "poj": "kái", "distractors": ["jīn", "chhâ", "chāu"], "note": "轉變。\n戒、戒除。\n悔悟。\n修正、批閱。", "vHanzi": "改", "vPoj": "kái", "entryId": "3209"},
  {"syl": 1, "verse": "辭庫", "hanzi": "認", "poj": "jīn", "distractors": ["chhâ", "chāu", "piàn"], "note": "辨識、分別。\n承認、同意。\n認親。藉由口頭或某種儀式來建立親屬關係或是師徒關係。", "vHanzi": "認", "vPoj": "jīn", "entryId": "10812"},
  {"syl": 1, "verse": "辭庫", "hanzi": "查", "poj": "chhâ", "distractors": ["chāu", "piàn", "thê"], "note": "考察、檢視。\n翻閱、檢尋。", "vHanzi": "查", "vPoj": "chhâ", "entryId": "5073"},
  {"syl": 1, "verse": "辭庫", "hanzi": "找", "poj": "chāu", "distractors": ["piàn", "thê", "choán"], "note": "買賣時，收到幣值較大的鈔票或硬幣，超過應收的數目，把超過的部分用幣值小的錢幣退還給顧客。", "vHanzi": "找", "vPoj": "chāu", "entryId": "3196"},
  {"syl": 1, "verse": "辭庫", "hanzi": "變", "poj": "piàn", "distractors": ["thê", "choán", "siâm"], "note": "更改。", "vHanzi": "變", "vPoj": "piàn", "entryId": "13271"},
  {"syl": 1, "verse": "辭庫", "hanzi": "提", "poj": "thê", "distractors": ["choán", "siâm", "bong"], "note": "舉出，揭示。\n從下往上移。\n把預定時間往前移。", "vHanzi": "提", "vPoj": "thê", "entryId": "8358"},
  {"syl": 1, "verse": "辭庫", "hanzi": "轉", "poj": "choán", "distractors": ["siâm", "bong", "kng"], "note": "改變方向。", "vHanzi": "轉", "vPoj": "choán", "entryId": "12620"},
  {"syl": 1, "verse": "辭庫", "hanzi": "尋", "poj": "siâm", "distractors": ["bong", "kng", "chhōe"], "note": "兩手合抱。", "vHanzi": "尋", "vPoj": "siâm", "entryId": "8290"},
  {"syl": 1, "verse": "辭庫", "hanzi": "摸", "poj": "bong", "distractors": ["kng", "chhōe", "táⁿ"], "note": "用手輕輕觸碰或摩擦，以感覺或尋找物體。", "vHanzi": "摸", "vPoj": "bong", "entryId": "10524"},
  {"syl": 1, "verse": "辭庫", "hanzi": "扛", "poj": "kng", "distractors": ["chhōe", "táⁿ", "pōe"], "note": "兩人以肩膀擔負重物。\n抬東西。", "vHanzi": "扛", "vPoj": "kng", "entryId": "2429"},
  {"syl": 1, "verse": "辭庫", "hanzi": "揣【替】", "poj": "chhōe", "distractors": ["táⁿ", "pōe", "khau"], "note": "尋找。", "vHanzi": "揣【替】", "vPoj": "chhōe", "entryId": "8409"},
  {"syl": 1, "verse": "辭庫", "hanzi": "打", "poj": "táⁿ", "distractors": ["pōe", "khau", "lia̍h"], "note": "敲撞、敲擊。\n戰鬥。\n折算現金。", "vHanzi": "打", "vPoj": "táⁿ", "entryId": "1650"},
  {"syl": 1, "verse": "辭庫", "hanzi": "背", "poj": "pōe", "distractors": ["khau", "lia̍h", "phō"], "note": "違反。\n記憶、背誦。", "vHanzi": "背", "vPoj": "pōe", "entryId": "5373"},
  {"syl": 1, "verse": "辭庫", "hanzi": "敲", "poj": "khau", "distractors": ["lia̍h", "phō", "poaⁿ"], "note": "擊、叩。", "vHanzi": "敲", "vPoj": "khau", "entryId": "10531"},
  {"syl": 1, "verse": "辭庫", "hanzi": "掠", "poj": "lia̍h", "distractors": ["phō", "poaⁿ", "tam"], "note": "捕、抓。\n估計、估算。\n按摩、捏揉。\n找出問題所在。\n控制使維持為某種狀態。\n購買牲畜。\n下載。", "vHanzi": "掠", "vPoj": "lia̍h", "entryId": "7303"},
  {"syl": 1, "verse": "辭庫", "hanzi": "抱", "poj": "phō", "distractors": ["poaⁿ", "tam", "phah"], "note": "摟在胸前，用雙手合圍。\n指收養。\n心中懷有某種念頭。", "vHanzi": "抱", "vPoj": "phō", "entryId": "3941"},
  {"syl": 1, "verse": "辭庫", "hanzi": "搬", "poj": "poaⁿ", "distractors": ["tam", "phah", "chhé"], "note": "使力移動較重或較大型的物體。\n演出、放映。\n遷移。", "vHanzi": "搬", "vPoj": "poaⁿ", "entryId": "9490"},
  {"syl": 1, "verse": "辭庫", "hanzi": "擔", "poj": "tam", "distractors": ["phah", "chhé", "that"], "note": "負責、承當。\n掛慮。", "vHanzi": "擔", "vPoj": "tam", "entryId": "11649"},
  {"syl": 1, "verse": "辭庫", "hanzi": "拍", "poj": "phah", "distractors": ["chhé", "that", "thoa"], "note": "用手打、打架。\n擊打、拍打。\n製造物品。\n打拳。\n敲擊按鍵。\n去除、除掉。\n交尾。\n驚醒。\n玩牌。\n射殺。\n結花蕾。\n買。\n拍攝。\n訂定（契約）。", "vHanzi": "拍", "vPoj": "phah", "entryId": "3956"},
  {"syl": 1, "verse": "辭庫", "hanzi": "扯", "poj": "chhé", "distractors": ["that", "thoa", "ta̍h"], "note": "打結。\n截短。\n引申為切斷關係、做個了結。\n截長補短、平均攤算。\n像魚鱗一樣重疊排列。", "vHanzi": "扯", "vPoj": "chhé", "entryId": "3144"},
  {"syl": 1, "verse": "辭庫", "hanzi": "踢", "poj": "that", "distractors": ["thoa", "ta̍h", "se̍h"], "note": "用腳觸擊。", "vHanzi": "踢", "vPoj": "that", "entryId": "11396"},
  {"syl": 1, "verse": "辭庫", "hanzi": "拖", "poj": "thoa", "distractors": ["ta̍h", "se̍h", "áu"], "note": "拖曳而行，足不離地的樣子。\n推託。\n延遲、延宕。\n苟延殘喘。", "vHanzi": "拖", "vPoj": "thoa", "entryId": "3964"},
  {"syl": 1, "verse": "辭庫", "hanzi": "踏", "poj": "ta̍h", "distractors": ["se̍h", "áu", "siak"], "note": "用腳踩著地或東西。\n估價、折現。\n言明在先。\n抽成。", "vHanzi": "踏", "vPoj": "ta̍h", "entryId": "11395"},
  {"syl": 1, "verse": "辭庫", "hanzi": "踅", "poj": "se̍h", "distractors": ["áu", "siak", "chih"], "note": "轉動。\n來回走動、繞行、盤旋或是散步。", "vHanzi": "踅", "vPoj": "se̍h", "entryId": "10852"},
  {"syl": 1, "verse": "辭庫", "hanzi": "拗", "poj": "áu", "distractors": ["siak", "chih", "the"], "note": "摺、折。\n使物體因彎曲而斷裂。\n強詞奪理、刻意曲解。", "vHanzi": "拗", "vPoj": "áu", "entryId": "3965"},
  {"syl": 1, "verse": "辭庫", "hanzi": "摔", "poj": "siak", "distractors": ["chih", "the", "chhiat"], "note": "跌倒。\n墜落。\n用力扔。", "vHanzi": "摔", "vPoj": "siak", "entryId": "10499"},
  {"syl": 1, "verse": "辭庫", "hanzi": "摺", "poj": "chih", "distractors": ["the", "chhiat", "chián"], "note": "折疊。", "vHanzi": "摺", "vPoj": "chih", "entryId": "10525"},
  {"syl": 1, "verse": "辭庫", "hanzi": "推", "poj": "the", "distractors": ["chhiat", "chián", "poa̍h"], "note": "委卸、推辭。", "vHanzi": "推", "vPoj": "the", "entryId": "7309"},
  {"syl": 1, "verse": "辭庫", "hanzi": "切", "poj": "chhiat", "distractors": ["chián", "poa̍h", "koah"], "note": "用刀將物品分開。", "vHanzi": "切", "vPoj": "chhiat", "entryId": "586"},
  {"syl": 1, "verse": "辭庫", "hanzi": "剪", "poj": "chián", "distractors": ["poa̍h", "koah", "chhit"], "note": "將東西裁斷。\n風強力地吹來。\n被蟲蛀掉。\n扒竊。", "vHanzi": "剪", "vPoj": "chián", "entryId": "6918"},
  {"syl": 1, "verse": "辭庫", "hanzi": "跋【替】", "poj": "poa̍h", "distractors": ["koah", "chhit", "siah"], "note": "跌、滾落。\n賭博。\n擲筊。", "vHanzi": "跋【替】", "vPoj": "poa̍h", "entryId": "9098"},
  {"syl": 1, "verse": "辭庫", "hanzi": "割", "poj": "koah", "distractors": ["chhit", "siah", "chhat"], "note": "用刀子等工具將東西切開或切斷。\n引申為分配或劃分東西。", "vHanzi": "割", "vPoj": "koah", "entryId": "8156"},
  {"syl": 1, "verse": "辭庫", "hanzi": "拭", "poj": "chhit", "distractors": ["siah", "chhat", "boah"], "note": "擦抹。", "vHanzi": "拭", "vPoj": "chhit", "entryId": "4907"},
  {"syl": 1, "verse": "辭庫", "hanzi": "削", "poj": "siah", "distractors": ["chhat", "boah", "chhò"], "note": "去皮、刨。\n刪除。\n拚鬥、競爭。\n挖苦，使人難堪、丟臉。", "vHanzi": "削", "vPoj": "siah", "entryId": "4696"},
  {"syl": 1, "verse": "辭庫", "hanzi": "擦", "poj": "chhat", "distractors": ["boah", "chhò", "chú"], "note": "擦拭。\n磨擦。", "vHanzi": "擦", "vPoj": "chhat", "entryId": "12145"},
  {"syl": 1, "verse": "辭庫", "hanzi": "抹", "poj": "boah", "distractors": ["chhò", "chú", "sé"], "note": "塗抹、擦。\n塗掉、銷除。", "vHanzi": "抹", "vPoj": "boah", "entryId": "3942"},
  {"syl": 1, "verse": "辭庫", "hanzi": "剉【替】", "poj": "chhò", "distractors": ["chú", "sé", "chhá"], "note": "砍。用刀斧劈。", "vHanzi": "剉【替】", "vPoj": "chhò", "entryId": "4695"},
  {"syl": 1, "verse": "辭庫", "hanzi": "煮", "poj": "chú", "distractors": ["sé", "chhá", "sàu"], "note": "烹調。烹飪、調理食物。", "vHanzi": "煮", "vPoj": "chú", "entryId": "8566"},
  {"syl": 1, "verse": "辭庫", "hanzi": "洗", "poj": "sé", "distractors": ["chhá", "sàu", "chà"], "note": "洗滌、清潔。\n淘洗、沖洗。\n婦女行經。\n譏諷。", "vHanzi": "洗", "vPoj": "sé", "entryId": "5127"},
  {"syl": 1, "verse": "辭庫", "hanzi": "炒", "poj": "chhá", "distractors": ["sàu", "chà", "thǹg"], "note": "一種烹飪方法。以少量的油為底，把食物放在鍋子裡，翻攪到熟了為止。", "vHanzi": "炒", "vPoj": "chhá", "entryId": "4319"},
  {"syl": 1, "verse": "辭庫", "hanzi": "掃", "poj": "sàu", "distractors": ["chà", "thǹg", "chhoe"], "note": "用掃帚清除灰塵、垃圾。\n用言語攻擊別人、駁斥別人。\n比喻吃光或買光。", "vHanzi": "掃", "vPoj": "sàu", "entryId": "7295"},
  {"syl": 1, "verse": "辭庫", "hanzi": "炸", "poj": "chà", "distractors": ["thǹg", "chhoe", "chheng"], "note": "火藥爆裂開來或是從空中投擲炸彈。", "vHanzi": "炸", "vPoj": "chà", "entryId": "5175"},
  {"syl": 1, "verse": "辭庫", "hanzi": "燙", "poj": "thǹg", "distractors": ["chhoe", "chheng", "chian"], "note": "一種烹調方法。將材料在滾水中快煮後撈出。\n被高熱的東西或火所傷。", "vHanzi": "燙", "vPoj": "thǹg", "entryId": "11775"},
  {"syl": 1, "verse": "辭庫", "hanzi": "炊", "poj": "chhoe", "distractors": ["chheng", "chian", "pōe"], "note": "以隔水加熱的方法把食物蒸熟。", "vHanzi": "炊", "vPoj": "chhoe", "entryId": "4317"},
  {"syl": 1, "verse": "辭庫", "hanzi": "清", "poj": "chheng", "distractors": ["chian", "pōe", "hang"], "note": "使乾淨、使明白。", "vHanzi": "清", "vPoj": "chheng", "entryId": "7513"},
  {"syl": 1, "verse": "辭庫", "hanzi": "煎", "poj": "chian", "distractors": ["pōe", "hang", "sio"], "note": "用少量的油乾煮食物。", "vHanzi": "煎", "vPoj": "chian", "entryId": "9687"},
  {"syl": 1, "verse": "辭庫", "hanzi": "焙", "poj": "pōe", "distractors": ["khau", "lia̍h", "phō"], "note": "用小火烘烤物體，使之乾燥。\n小火加熱食物。", "vHanzi": "焙", "vPoj": "pōe", "entryId": "8561"},
  {"syl": 1, "verse": "辭庫", "hanzi": "烘", "poj": "hang", "distractors": ["sio", "pàng", "peng"], "note": "用火燒烤。\n藉火取暖。\n藉助外來的熱源把帶有水分的物品烤乾。", "vHanzi": "烘", "vPoj": "hang", "entryId": "6228"},
  {"syl": 1, "verse": "辭庫", "hanzi": "燒", "poj": "sio", "distractors": ["pàng", "peng", "khǹg"], "note": "使東西著火。\n中傷、挑撥離間。", "vHanzi": "燒", "vPoj": "sio", "entryId": "11772"},
  {"syl": 1, "verse": "辭庫", "hanzi": "放", "poj": "pàng", "distractors": ["peng", "khǹg", "siu"], "note": "發出、釋出。\n解脫釋出。\n留下。\n丟下不管。\n解除束縛。\n借出金錢收取利息。\n使鬆弛。\n點燃。", "vHanzi": "放", "vPoj": "pàng", "entryId": "3970"},
  {"syl": 1, "verse": "辭庫", "hanzi": "冰", "poj": "peng", "distractors": ["khǹg", "siu", "thiah"], "note": "用低溫保存物品。\n擱著不用。", "vHanzi": "冰", "vPoj": "peng", "entryId": "2103"},
  {"syl": 1, "verse": "辭庫", "hanzi": "囥", "poj": "khǹg", "distractors": ["siu", "thiah", "pái"], "note": "擱、保留。\n放入。\n存放。", "vHanzi": "囥", "vPoj": "khǹg", "entryId": "3017"},
  {"syl": 1, "verse": "辭庫", "hanzi": "收", "poj": "siu", "distractors": ["thiah", "pái", "pâi"], "note": "聚合，納入。\n保存，儲藏。\n割取成熟的農作物。\n整理。\n結束，停止。\n收回，取回。\n取回自己有權取得的東西。\n接受、容留。\n逮捕。\n價購。", "vHanzi": "收", "vPoj": "siu", "entryId": "2434"},
  {"syl": 1, "verse": "辭庫", "hanzi": "拆", "poj": "thiah", "distractors": ["pái", "pâi", "chhàng"], "note": "撕開、撕破。\n拆除。\n分開、打開。\n購買。\n攤開來表明。\n表現分開的動作。", "vHanzi": "拆", "vPoj": "thiah", "entryId": "3949"},
  {"syl": 1, "verse": "辭庫", "hanzi": "擺", "poj": "pái", "distractors": ["pâi", "chhàng", "khai"], "note": "搖動、晃動。\n臨時借貸。", "vHanzi": "擺", "vPoj": "pái", "entryId": "12482"},
  {"syl": 1, "verse": "辭庫", "hanzi": "排", "poj": "pâi", "distractors": ["chhàng", "khai", "só"], "note": "一個接著一個，按照順序擺列。\n並列、擺列、陳列。\n疏導、疏通、摒除。", "vHanzi": "排", "vPoj": "pâi", "entryId": "7297"},
  {"syl": 1, "verse": "辭庫", "hanzi": "藏【替】", "poj": "chhàng", "distractors": ["khai", "só", "chng"], "note": "躲、隱匿。", "vHanzi": "藏【替】", "vPoj": "chhàng", "entryId": "12590"},
  {"syl": 1, "verse": "辭庫", "hanzi": "開", "poj": "khai", "distractors": ["só", "chng", "kái"], "note": "花錢。\n張開、綻放。\n起始。\n發展、開闢。\n嫖妓。", "vHanzi": "開", "vPoj": "khai", "entryId": "9144"},
  {"syl": 1, "verse": "辭庫", "hanzi": "鎖", "poj": "só", "distractors": ["chng", "kái", "koaiⁿ"], "note": "用鎖關住或拴住。", "vHanzi": "鎖", "vPoj": "só", "entryId": "12652"},
  {"syl": 1, "verse": "辭庫", "hanzi": "裝", "poj": "chng", "distractors": ["kái", "koaiⁿ", "kah"], "note": "填裝。\n打扮成。", "vHanzi": "裝", "vPoj": "chng", "entryId": "9995"},
  {"syl": 1, "verse": "辭庫", "hanzi": "解", "poj": "kái", "distractors": ["jīn", "chhâ", "chāu"], "note": "解除、消除。\n分剖。\n明白。", "vHanzi": "解", "vPoj": "kái", "entryId": "9999"},
  {"syl": 1, "verse": "辭庫", "hanzi": "關", "poj": "koaiⁿ", "distractors": ["kah", "tah", "pa̍k"], "note": "閉。\n使功能作用停止。\n監禁。\n商店打烊。\n指商店倒閉。", "vHanzi": "關", "vPoj": "koaiⁿ", "entryId": "12900"},
  {"syl": 1, "verse": "辭庫", "hanzi": "蓋", "poj": "kah", "distractors": ["tah", "pa̍k", "lia̍p"], "note": "覆罩、遮蔽。", "vHanzi": "蓋", "vPoj": "kah", "entryId": "10785"},
  {"syl": 1, "verse": "辭庫", "hanzi": "貼", "poj": "tah", "distractors": ["pa̍k", "lia̍p", "tòng"], "note": "黏合。", "vHanzi": "貼", "vPoj": "tah", "entryId": "9041"},
  {"syl": 1, "verse": "辭庫", "hanzi": "縛", "poj": "pa̍k", "distractors": ["lia̍p", "tòng", "chiap"], "note": "有形或無形的束縛、捆綁。\n編織長篾片製成的器物。", "vHanzi": "縛", "vPoj": "pa̍k", "entryId": "11830"},
  {"syl": 1, "verse": "辭庫", "hanzi": "捏", "poj": "lia̍p", "distractors": ["tòng", "chiap", "liâm"], "note": "用手指將軟東西搓捻成某種形狀。\n引申為父母辛勤照顧子女。", "vHanzi": "捏", "vPoj": "lia̍p", "entryId": "5995"},
  {"syl": 1, "verse": "辭庫", "hanzi": "擋【替】", "poj": "tòng", "distractors": ["chiap", "liâm", "tòe"], "note": "攔阻。\n忍、撐。", "vHanzi": "擋【替】", "vPoj": "tòng", "entryId": "11645"},
  {"syl": 1, "verse": "辭庫", "hanzi": "接", "poj": "chiap", "distractors": ["liâm", "tòe", "kńg"], "note": "迎接、接待。\n連接、接合。\n接到、收到。\n替代。\n繼續。", "vHanzi": "接", "vPoj": "chiap", "entryId": "7306"},
  {"syl": 1, "verse": "辭庫", "hanzi": "黏", "poj": "liâm", "distractors": ["tòe", "kńg", "chhah"], "note": "用膠之類的接著劑使兩物接合。", "vHanzi": "黏", "vPoj": "liâm", "entryId": "12447"},
  {"syl": 1, "verse": "辭庫", "hanzi": "綴", "poj": "tòe", "distractors": ["kńg", "chhah", "chō"], "note": "跟、隨。", "vHanzi": "綴", "vPoj": "tòe", "entryId": "10747"},
  {"syl": 1, "verse": "辭庫", "hanzi": "捲", "poj": "kńg", "distractors": ["chhah", "chō", "kiáu"], "note": "將東西彎成圓筒形。\n捲吞、吞噬。", "vHanzi": "捲", "vPoj": "kńg", "entryId": "7287"},
  {"syl": 1, "verse": "辭庫", "hanzi": "插", "poj": "chhah", "distractors": ["chō", "kiáu", "siu"], "note": "把物體扎入或固定在某處。\n從腋下扶起。\n打賭。", "vHanzi": "插", "vPoj": "chhah", "entryId": "8360"},
  {"syl": 1, "verse": "辭庫", "hanzi": "造", "poj": "chō", "distractors": ["kiáu", "siu", "poāⁿ"], "note": "製作、建造。", "vHanzi": "造", "vPoj": "chō", "entryId": "7904"},
  {"syl": 1, "verse": "辭庫", "hanzi": "攪", "poj": "kiáu", "distractors": ["siu", "poāⁿ", "jiû"], "note": "混和、摻雜。\n擾亂、打擾。", "vHanzi": "攪", "vPoj": "kiáu", "entryId": "13260"},
  {"syl": 1, "verse": "辭庫", "hanzi": "修", "poj": "siu", "distractors": ["thiah", "pái", "pâi"], "note": "修理、整治。\n學習。\n剃、削平。", "vHanzi": "修", "vPoj": "siu", "entryId": "5690"},
  {"syl": 1, "verse": "辭庫", "hanzi": "拌【替】", "poj": "poāⁿ", "distractors": ["jiû", "choh", "pó͘"], "note": "拍打、撣。\n驅趕蚊蟲。", "vHanzi": "拌【替】", "vPoj": "poāⁿ", "entryId": "3955"},
  {"syl": 1, "verse": "辭庫", "hanzi": "揉", "poj": "jiû", "distractors": ["choh", "pó͘", "phò"], "note": "用溼的布巾擦拭物品。", "vHanzi": "揉", "vPoj": "jiû", "entryId": "8353"},
  {"syl": 1, "verse": "辭庫", "hanzi": "作", "poj": "choh", "distractors": ["pó͘", "phò", "lak"], "note": "從事農耕。\n創作製造。", "vHanzi": "作", "vPoj": "choh", "entryId": "2866"},
  {"syl": 1, "verse": "辭庫", "hanzi": "補", "poj": "pó͘", "distractors": ["phò", "lak", "kòe"], "note": "修治破損的事物。\n補充有所欠缺的。\n攝取營養以滋補身體。\n補償、彌補。", "vHanzi": "補", "vPoj": "pó͘", "entryId": "9994"},
  {"syl": 1, "verse": "辭庫", "hanzi": "破", "poj": "phò", "distractors": ["lak", "kòe", "ji̍p"], "note": "毀壞。\n耗費。", "vHanzi": "破", "vPoj": "phò", "entryId": "6378"},
  {"syl": 1, "verse": "辭庫", "hanzi": "落", "poj": "lak", "distractors": ["kòe", "ji̍p", "chò"], "note": "掉落、脫落。\n下降、下跌。\n退步。\n遺失。", "vHanzi": "落", "vPoj": "lak", "entryId": "9862"},
  {"syl": 1, "verse": "辭庫", "hanzi": "過", "poj": "kòe", "distractors": ["ji̍p", "chò", "chhut"], "note": "經過、通過或度過某個空間、時間。\n轉讓、移轉財產。\n傳染。\n過意。\n過繼。\n超過。\n使經過。", "vHanzi": "過", "vPoj": "kòe", "entryId": "10149"},
  {"syl": 1, "verse": "辭庫", "hanzi": "入", "poj": "ji̍p", "distractors": ["chò", "chhut", "khì"], "note": "進。從外面進到裡面。\n裝進。\n收進帳款。", "vHanzi": "入", "vPoj": "ji̍p", "entryId": "47"},
  {"syl": 1, "verse": "辭庫", "hanzi": "做", "poj": "chò", "distractors": ["chhut", "khì", "lâi"], "note": "進行某一件事情。\n擔任或從事某種行業、工作。\n製做。\n身為、具有、成為一種身分。\n招惹。\n寫作。\n擔任某種職務。\n結成某種關係。\n放在對比的句子裡，表示不相涉。\n許配、訂親。", "vHanzi": "做", "vPoj": "chò", "entryId": "6913"},
  {"syl": 1, "verse": "辭庫", "hanzi": "出", "poj": "chhut", "distractors": ["khì", "lâi", "hôe"], "note": "蘊育、發生。\n湧出、露出。\n離開原來的環境到另一個環境。\n超過。\n生產、出產。\n奉獻財物。\n發洩。\n顯露。\n買方提議買價、還價。", "vHanzi": "出", "vPoj": "chhut", "entryId": "1378"},
  {"syl": 1, "verse": "辭庫", "hanzi": "去", "poj": "khì", "distractors": ["lâi", "hôe", "chìn"], "note": "往、到。\n從事某事。\n離開。\n諱指死亡。\n完蛋了、沒了、輸了。\n花費。\n消除。", "vHanzi": "去", "vPoj": "khì", "entryId": "1395"},
  {"syl": 1, "verse": "辭庫", "hanzi": "來", "poj": "lâi", "distractors": ["hôe", "chìn", "thè"], "note": "人或物往接近自己的空間移動。\n表示互相交流。通常與往、去並用。\n給、送來。\n可取代某些動詞，表示當時情境中的某個動作。", "vHanzi": "來", "vPoj": "lâi", "entryId": "3529"},
  {"syl": 1, "verse": "辭庫", "hanzi": "回", "poj": "hôe", "distractors": ["chìn", "thè", "chiūⁿ"], "note": "掉轉。\n返、歸。\n回應、還擊。\n改變。\n答覆。\n謝絕、辭去。", "vHanzi": "回", "vPoj": "hôe", "entryId": "2125"},
  {"syl": 1, "verse": "辭庫", "hanzi": "進", "poj": "chìn", "distractors": ["thè", "chiūⁿ", "hē"], "note": "向前移動。", "vHanzi": "進", "vPoj": "chìn", "entryId": "9104"},
  {"syl": 1, "verse": "辭庫", "hanzi": "退", "poj": "thè", "distractors": ["chiūⁿ", "hē", "pôe"], "note": "背向後方行走。\n離開。\n減損、消失。\n取消、解除。", "vHanzi": "退", "vPoj": "thè", "entryId": "6676"},
  {"syl": 1, "verse": "辭庫", "hanzi": "上", "poj": "chiūⁿ", "distractors": ["hē", "pôe", "thāi"], "note": "登上、爬上。\n把東西端上去。", "vHanzi": "上", "vPoj": "chiūⁿ", "entryId": "164"},
  {"syl": 1, "verse": "辭庫", "hanzi": "下", "poj": "hē", "distractors": ["pôe", "thāi", "tán"], "note": "放置、加進去。\n許願。", "vHanzi": "下", "vPoj": "hē", "entryId": "169"},
  {"syl": 1, "verse": "辭庫", "hanzi": "陪", "poj": "pôe", "distractors": ["thāi", "tán", "lâu"], "note": "伴隨。\n交往。\n交際應酬、接待賓客。", "vHanzi": "陪", "vPoj": "pôe", "entryId": "8007"},
  {"syl": 1, "verse": "辭庫", "hanzi": "待", "poj": "thāi", "distractors": ["tán", "lâu", "kàu"], "note": "對待。\n等候。", "vHanzi": "待", "vPoj": "thāi", "entryId": "4896"},
  {"syl": 1, "verse": "辭庫", "hanzi": "等", "poj": "tán", "distractors": ["lâu", "kàu", "phoāⁿ"], "note": "候、待。", "vHanzi": "等", "vPoj": "tán", "entryId": "8817"},
  {"syl": 1, "verse": "辭庫", "hanzi": "留", "poj": "lâu", "distractors": ["kàu", "phoāⁿ", "hù"], "note": "保存。\n停留。\n蓄留。", "vHanzi": "留", "vPoj": "lâu", "entryId": "6335"},
  {"syl": 1, "verse": "辭庫", "hanzi": "到【替】", "poj": "kàu", "distractors": ["phoāⁿ", "hù", "kià"], "note": "抵達、到達。\n到了、到期。\n賭博時表示胡牌的用語。", "vHanzi": "到【替】", "vPoj": "kàu", "entryId": "3592"},
  {"syl": 1, "verse": "辭庫", "hanzi": "伴", "poj": "phoāⁿ", "distractors": ["hù", "kià", "hō͘"], "note": "陪同。", "vHanzi": "伴", "vPoj": "phoāⁿ", "entryId": "2854"},
  {"syl": 1, "verse": "辭庫", "hanzi": "付", "poj": "hù", "distractors": ["kià", "hō͘", "chioh"], "note": "交出。", "vHanzi": "付", "vPoj": "hù", "entryId": "1302"},
  {"syl": 1, "verse": "辭庫", "hanzi": "寄", "poj": "kià", "distractors": ["hō͘", "chioh", "sàng"], "note": "寄送。\n委託、存放。\n設定。", "vHanzi": "寄", "vPoj": "kià", "entryId": "7136"},
  {"syl": 1, "verse": "辭庫", "hanzi": "予", "poj": "hō͘", "distractors": ["chioh", "sàng", "ngiâ"], "note": "給予。", "vHanzi": "予", "vPoj": "hō͘", "entryId": "564"},
  {"syl": 1, "verse": "辭庫", "hanzi": "借", "poj": "chioh", "distractors": ["sàng", "ngiâ", "hoân"], "note": "兩個人之間借貸關係的總稱。", "vHanzi": "借", "vPoj": "chioh", "entryId": "5710"},
  {"syl": 1, "verse": "辭庫", "hanzi": "送", "poj": "sàng", "distractors": ["ngiâ", "hoân", "bé"], "note": "陪伴某人走一段路。\n贈送。\n運輸、派發。", "vHanzi": "送", "vPoj": "sàng", "entryId": "6677"},
  {"syl": 1, "verse": "辭庫", "hanzi": "迎", "poj": "ngiâ", "distractors": ["hoân", "bé", "bē"], "note": "成群結隊抬著人或物上街遊行，讓大眾觀看。\n接、逢。", "vHanzi": "迎", "vPoj": "ngiâ", "entryId": "4487"},
  {"syl": 1, "verse": "辭庫", "hanzi": "還", "poj": "hoân", "distractors": ["bé", "bē", "khiàm"], "note": "歸回原主。\n返回、歸復。", "vHanzi": "還", "vPoj": "hoân", "entryId": "12412"},
  {"syl": 1, "verse": "辭庫", "hanzi": "買", "poj": "bé", "distractors": ["bē", "khiàm", "séng"], "note": "使用金錢購物。", "vHanzi": "買", "vPoj": "bé", "entryId": "9037"},
  {"syl": 1, "verse": "辭庫", "hanzi": "賣", "poj": "bē", "distractors": ["khiàm", "séng", "chûn"], "note": "出售貨品、財物或勞力以換取金錢。", "vHanzi": "賣", "vPoj": "bē", "entryId": "11390"},
  {"syl": 1, "verse": "辭庫", "hanzi": "欠", "poj": "khiàm", "distractors": ["séng", "chûn", "pí"], "note": "賒欠。\n缺少。", "vHanzi": "欠", "vPoj": "khiàm", "entryId": "806"},
  {"syl": 1, "verse": "辭庫", "hanzi": "省", "poj": "séng", "distractors": ["chûn", "pí", "pôe"], "note": "節約、節省。", "vHanzi": "省", "vPoj": "séng", "entryId": "5304"},
  {"syl": 1, "verse": "辭庫", "hanzi": "存", "poj": "chûn", "distractors": ["pí", "pôe", "kiáu"], "note": "儲蓄。\n保留。\n心裡懷有某種意念。", "vHanzi": "存", "vPoj": "chûn", "entryId": "2277"},
  {"syl": 1, "verse": "辭庫", "hanzi": "比", "poj": "pí", "distractors": ["pôe", "kiáu", "ēng"], "note": "量尺寸、試大小。\n比擬。\n指、比畫。\n較量。\n等同。\n比率。", "vHanzi": "比", "vPoj": "pí", "entryId": "810"},
  {"syl": 1, "verse": "辭庫", "hanzi": "賠", "poj": "pôe", "distractors": ["kiáu", "ēng", "hoe"], "note": "用財物補償別人的損失。\n道歉。", "vHanzi": "賠", "vPoj": "pôe", "entryId": "11388"},
  {"syl": 1, "verse": "辭庫", "hanzi": "繳", "poj": "kiáu", "distractors": ["siu", "poāⁿ", "jiû"], "note": "交納錢財。", "vHanzi": "繳", "vPoj": "kiáu", "entryId": "12814"},
  {"syl": 1, "verse": "辭庫", "hanzi": "用", "poj": "ēng", "distractors": ["hoe", "su", "pāi"], "note": "使用、施行。\n花錢。\n進食、吃喝。\n差使、使喚。", "vHanzi": "用", "vPoj": "ēng", "entryId": "1843"},
  {"syl": 1, "verse": "辭庫", "hanzi": "花", "poj": "hoe", "distractors": ["su", "pāi", "léng"], "note": "紛亂、錯亂。\n耍賴、胡鬧。", "vHanzi": "花", "vPoj": "hoe", "entryId": "4426"},
  {"syl": 1, "verse": "辭庫", "hanzi": "輸", "poj": "su", "distractors": ["oàn", "hūn", "thiàⁿ"], "note": "贏的相反。\n不如、比不上。\n運送、運輸。\n打賭。", "vHanzi": "輸", "vPoj": "su", "entryId": "11947"},
  {"syl": 1, "verse": "辭庫", "hanzi": "敗", "poj": "pāi", "distractors": ["léng", "cheⁿ", "chhiúⁿ"], "note": "毀壞、損壞。\n將家產揮霍殆盡。\n事情不成功、失利、輸了。", "vHanzi": "敗", "vPoj": "pāi", "entryId": "7317"},
  {"syl": 1, "verse": "辭庫", "hanzi": "領", "poj": "léng", "distractors": ["cheⁿ", "chhiúⁿ", "iâⁿ"], "note": "統率、主導事情。\n接受、承受、取得。\n擁有、管轄。", "vHanzi": "領", "vPoj": "léng", "entryId": "10915"},
  {"syl": 1, "verse": "辭庫", "hanzi": "爭", "poj": "cheⁿ", "distractors": ["chhiúⁿ", "iâⁿ", "sat"], "note": "奪取、互不相讓。 ", "vHanzi": "爭", "vPoj": "cheⁿ", "entryId": "4322"},
  {"syl": 1, "verse": "辭庫", "hanzi": "搶", "poj": "chhiúⁿ", "distractors": ["iâⁿ", "sat", "chhī"], "note": "奪取。", "vHanzi": "搶", "vPoj": "chhiúⁿ", "entryId": "9493"},
  {"syl": 1, "verse": "辭庫", "hanzi": "贏", "poj": "iâⁿ", "distractors": ["sat", "chhī", "pó"], "note": "勝利。", "vHanzi": "贏", "vPoj": "iâⁿ", "entryId": "13009"},
  {"syl": 1, "verse": "辭庫", "hanzi": "殺", "poj": "sat", "distractors": ["chhī", "pó", "mā"], "note": "使喪失生命。", "vHanzi": "殺", "vPoj": "sat", "entryId": "7472"},
  {"syl": 1, "verse": "辭庫", "hanzi": "飼", "poj": "chhī", "distractors": ["pó", "mā", "kiù"], "note": "養育。\n畜養。\n餵食。\n包養。", "vHanzi": "飼", "vPoj": "chhī", "entryId": "10286"},
  {"syl": 1, "verse": "辭庫", "hanzi": "保", "poj": "pó", "distractors": ["mā", "kiù", "kò͘"], "note": "保證、擔保。\n維持、持有。", "vHanzi": "保", "vPoj": "pó", "entryId": "4691"},
  {"syl": 1, "verse": "辭庫", "hanzi": "罵", "poj": "mā", "distractors": ["kiù", "kò͘", "tàu"], "note": "向別人說粗話、重話以示侮辱或責備。", "vHanzi": "罵", "vPoj": "mā", "entryId": "11282"},
  {"syl": 1, "verse": "辭庫", "hanzi": "救", "poj": "kiù", "distractors": ["kò͘", "tàu", "ím"], "note": "幫助人或動物等脫離困境、險境或是解除生命危機。", "vHanzi": "救", "vPoj": "kiù", "entryId": "7316"},
  {"syl": 1, "verse": "辭庫", "hanzi": "顧", "poj": "kò͘", "distractors": ["tàu", "ím", "chē"], "note": "照顧，看護。\n維護。\n只管。", "vHanzi": "顧", "vPoj": "kò͘", "entryId": "13169"},
  {"syl": 1, "verse": "辭庫", "hanzi": "鬥", "poj": "tàu", "distractors": ["ím", "chē", "chia̍h"], "note": "相爭。\n裝上、組合。\n幫忙。\n合計。\n湊數。\n男女未婚同居。", "vHanzi": "鬥", "vPoj": "tàu", "entryId": "6802"},
  {"syl": 2, "verse": "辭庫", "hanzi": "食飽", "poj": "chia̍h-pá", "distractors": ["lim chúi", "lim tê", "chia̍h-tê"], "note": "吃飽。", "vHanzi": "食飽", "vPoj": "chia̍h-pá", "entryId": "14597"},
  {"syl": 2, "verse": "辭庫", "hanzi": "啉水", "poj": "lim chúi", "distractors": ["lim tê", "chia̍h-tê", "khùn-tàu"], "note": "喝水。", "vHanzi": "啉水", "vPoj": "lim chúi", "entryId": "7030"},
  {"syl": 2, "verse": "辭庫", "hanzi": "啉茶", "poj": "lim tê", "distractors": ["chia̍h-tê", "khùn-tàu", "khí-chhn̂g"], "note": "喝茶。", "vHanzi": "啉茶", "vPoj": "lim tê", "entryId": "7046"},
  {"syl": 2, "verse": "辭庫", "hanzi": "食茶", "poj": "chia̍h-tê", "distractors": ["khùn-tàu", "khí-chhn̂g", "ak-chúi"], "note": "喝茶。\n「食新娘茶」(tsia̍h sin-niû-tê)的簡稱。婚宴之後，新娘端茶出來請大家喝，藉以拜見公公和婆婆，同時也和親族相見；奉茶時，要講好話，並以紅包回禮。", "vHanzi": "食茶", "vPoj": "chia̍h-tê", "entryId": "14178"},
  {"syl": 2, "verse": "辭庫", "hanzi": "睏晝", "poj": "khùn-tàu", "distractors": ["khí-chhn̂g", "ak-chúi", "chú-chia̍h"], "note": "午睡。中午時間的小睡。", "vHanzi": "睏晝", "vPoj": "khùn-tàu", "entryId": "8800"},

  {"syl": 2, "verse": "辭庫", "hanzi": "服侍", "poj": "ho̍k-sāi", "distractors": ["kiàn-siat", "siat-kè", "chai-pôe"], "note": "照料、伺候。\n供奉神明。", "vHanzi": "服侍", "vPoj": "ho̍k-sāi", "entryId": "4216"},
  {"syl": 2, "verse": "辭庫", "hanzi": "建設", "poj": "kiàn-siat", "distractors": ["siat-kè", "chai-pôe", "chhòng-chō"], "note": "創建事業或增添設施。", "vHanzi": "建設", "vPoj": "kiàn-siat", "entryId": "4878"},
  {"syl": 2, "verse": "辭庫", "hanzi": "設計", "poj": "siat-kè", "distractors": ["chai-pôe", "chhòng-chō", "chè-chō"], "note": "謀畫算計。\n預先規劃，製訂圖樣。", "vHanzi": "設計", "vPoj": "siat-kè", "entryId": "7866"},
  {"syl": 2, "verse": "辭庫", "hanzi": "栽培", "poj": "chai-pôe", "distractors": ["chhòng-chō", "chè-chō", "seng-sán"], "note": "種植。\n教養培育人才。\n提拔。", "vHanzi": "栽培", "vPoj": "chai-pôe", "entryId": "6128"},
  {"syl": 2, "verse": "辭庫", "hanzi": "創造", "poj": "chhòng-chō", "distractors": ["chè-chō", "seng-sán", "ak-hoe"], "note": "發明製造、建造。", "vHanzi": "創造", "vPoj": "chhòng-chō", "entryId": "8219"},
  {"syl": 2, "verse": "辭庫", "hanzi": "製造", "poj": "chè-chō", "distractors": ["seng-sán", "ak-hoe", "chih-saⁿ"], "note": "製作、建造。", "vHanzi": "製造", "vPoj": "chè-chō", "entryId": "10839"},
  {"syl": 2, "verse": "辭庫", "hanzi": "生產", "poj": "seng-sán", "distractors": ["ak-hoe", "chih-saⁿ", "poaⁿ-chhù"], "note": "分娩。生孩子，母體產出嬰兒的動作或過程。\n人類用各種資本來創造各種成品。", "vHanzi": "生產", "vPoj": "seng-sán", "entryId": "1944"},
  {"syl": 2, "verse": "辭庫", "hanzi": "沃花", "poj": "ak-hoe", "distractors": ["chih-saⁿ", "poaⁿ-chhù", "cho͘-chhù"], "note": "澆花。", "vHanzi": "沃花", "vPoj": "ak-hoe", "entryId": "3305"},
  {"syl": 2, "verse": "辭庫", "hanzi": "摺衫", "poj": "chih-saⁿ", "distractors": ["poaⁿ-chhù", "cho͘-chhù", "khai-káng"], "note": "把衣服摺疊起來。", "vHanzi": "摺衫", "vPoj": "chih-saⁿ", "entryId": "10548"},
  {"syl": 2, "verse": "辭庫", "hanzi": "搬厝", "poj": "poaⁿ-chhù", "distractors": ["cho͘-chhù", "khai-káng", "chhun-chhiú"], "note": "搬家。", "vHanzi": "搬厝", "vPoj": "poaⁿ-chhù", "entryId": "9521"},
  {"syl": 2, "verse": "辭庫", "hanzi": "租厝", "poj": "cho͘-chhù", "distractors": ["khai-káng", "chhun-chhiú", "khan-chhiú"], "note": "租屋。", "vHanzi": "租厝", "vPoj": "cho͘-chhù", "entryId": "6445"},
  {"syl": 2, "verse": "辭庫", "hanzi": "開講", "poj": "khai-káng", "distractors": ["chhun-chhiú", "khan-chhiú", "khiā-khí"], "note": "閒談聊天。\n開始演講。", "vHanzi": "開講", "vPoj": "khai-káng", "entryId": "9208"},
  {"syl": 2, "verse": "辭庫", "hanzi": "伸手", "poj": "chhun-chhiú", "distractors": ["khan-chhiú", "khiā-khí", "ak-chhiú"], "note": "伸出手臂來。\n向人要錢。", "vHanzi": "伸手", "vPoj": "chhun-chhiú", "entryId": "2881"},
  {"syl": 2, "verse": "辭庫", "hanzi": "牽手", "poj": "khan-chhiú", "distractors": ["khiā-khí", "ak-chhiú", "pàng-chhiú"], "note": "手牽著手。", "vHanzi": "牽手", "vPoj": "khan-chhiú", "entryId": "7580"},
  {"syl": 2, "verse": "辭庫", "hanzi": "徛起", "poj": "khiā-khí", "distractors": ["ak-chhiú", "pàng-chhiú", "hû-chhî"], "note": "立足。\n日常生活起居。", "vHanzi": "徛起", "vPoj": "khiā-khí", "entryId": "7257"},
  {"syl": 2, "verse": "辭庫", "hanzi": "握手", "poj": "ak-chhiú", "distractors": ["pàng-chhiú", "hû-chhî", "lo̍h-hō͘"], "note": "彼此伸手互相握住，是見面時的禮節，也可以表示親近或信任。", "vHanzi": "握手", "vPoj": "ak-chhiú", "entryId": "8429"},
  {"syl": 2, "verse": "辭庫", "hanzi": "放手", "poj": "pàng-chhiú", "distractors": ["hû-chhî", "lo̍h-hō͘", "khí-hong"], "note": "鬆手。\n置之不理。\n解除干預。", "vHanzi": "放手", "vPoj": "pàng-chhiú", "entryId": "3982"},
  {"syl": 2, "verse": "辭庫", "hanzi": "扶持", "poj": "hû-chhî", "distractors": ["lo̍h-hō͘", "khí-hong", "chhut-ji̍t"], "note": "攙扶。\n保護。", "vHanzi": "扶持", "vPoj": "hû-chhî", "entryId": "3169"},
  {"syl": 2, "verse": "辭庫", "hanzi": "落雨", "poj": "lo̍h-hō͘", "distractors": ["khí-hong", "chhut-ji̍t", "khui-hoe"], "note": "下雨。", "vHanzi": "落雨", "vPoj": "lo̍h-hō͘", "entryId": "9920"},
  {"syl": 2, "verse": "辭庫", "hanzi": "起風", "poj": "khí-hong", "distractors": ["chhut-ji̍t", "khui-hoe", "chia̍h-pá"], "note": "颳風。", "vHanzi": "起風", "vPoj": "khí-hong", "entryId": "6733"},
  {"syl": 2, "verse": "辭庫", "hanzi": "出日", "poj": "chhut-ji̍t", "distractors": ["khui-hoe", "chia̍h-pá", "lim chúi"], "note": "出太陽，意指天氣晴朗。", "vHanzi": "出日", "vPoj": "chhut-ji̍t", "entryId": "27562"},
  {"syl": 2, "verse": "辭庫", "hanzi": "開花", "poj": "khui-hoe", "distractors": ["chia̍h-pá", "lim chúi", "lim tê"], "note": "植物的花朵開放。\n指事情搞砸，做不成了。", "vHanzi": "開花", "vPoj": "khui-hoe", "entryId": "9174"},
  {"syl": 3, "verse": "辭庫", "hanzi": "毋知影", "poj": "m̄ chai-iáⁿ", "distractors": ["khoàⁿ-i-seng", "bē-kì-tit", "tàu-saⁿ-kāng"], "note": "不知、不知道。", "vHanzi": "毋知影", "vPoj": "m̄ chai-iáⁿ", "entryId": "979"},
  {"syl": 3, "verse": "辭庫", "hanzi": "看醫生", "poj": "khoàⁿ-i-seng", "distractors": ["bē-kì-tit", "tàu-saⁿ-kāng", "chhōe thâu-lō͘"], "note": "看病。找醫生診病。", "vHanzi": "看醫生", "vPoj": "khoàⁿ-i-seng", "entryId": "5359"},
  {"syl": 3, "verse": "辭庫", "hanzi": "袂記得", "poj": "bē-kì-tit", "distractors": ["tàu-saⁿ-kāng", "chhōe thâu-lō͘", "kóng-pe̍h-chha̍t"], "note": "忘記、遺忘。語氣完結時唸作bē-kì--tit。", "vHanzi": "袂記得", "vPoj": "bē-kì-tit", "entryId": "6652"},
  {"syl": 3, "verse": "辭庫", "hanzi": "鬥相共", "poj": "tàu-saⁿ-kāng", "distractors": ["chhōe thâu-lō͘", "kóng-pe̍h-chha̍t", "chò-seⁿ-ji̍t"], "note": "幫忙。幫助他人做事或解決困難。", "vHanzi": "鬥相共", "vPoj": "tàu-saⁿ-kāng", "entryId": "6842"},
  {"syl": 3, "verse": "辭庫", "hanzi": "揣頭路", "poj": "chhōe thâu-lō͘", "distractors": ["kóng-pe̍h-chha̍t", "chò-seⁿ-ji̍t", "chò-seng-lí"], "note": "找工作。", "vHanzi": "揣頭路", "vPoj": "chhōe thâu-lō͘", "entryId": "8470"},
  {"syl": 3, "verse": "辭庫", "hanzi": "講白賊", "poj": "kóng-pe̍h-chha̍t", "distractors": ["chò-seⁿ-ji̍t", "chò-seng-lí", "sé-sin-khu"], "note": "說謊、撒謊。", "vHanzi": "講白賊", "vPoj": "kóng-pe̍h-chha̍t", "entryId": "12377"},
  {"syl": 3, "verse": "辭庫", "hanzi": "做生日", "poj": "chò-seⁿ-ji̍t", "distractors": ["chò-seng-lí", "sé-sin-khu", "lâu ba̍k-sái"], "note": "慶生、過生日。舉行生日的慶祝活動。", "vHanzi": "做生日", "vPoj": "chò-seⁿ-ji̍t", "entryId": "6944"},
  {"syl": 3, "verse": "辭庫", "hanzi": "做生理", "poj": "chò-seng-lí", "distractors": ["sé-sin-khu", "lâu ba̍k-sái", "lâu phīⁿ-chúi"], "note": "做生意。經營商業，買賣物品。", "vHanzi": "做生理", "vPoj": "chò-seng-lí", "entryId": "6946"},
  {"syl": 3, "verse": "辭庫", "hanzi": "洗身軀", "poj": "sé-sin-khu", "distractors": ["lâu ba̍k-sái", "lâu phīⁿ-chúi", "phah-kha-chhiùⁿ"], "note": "洗澡。", "vHanzi": "洗身軀", "vPoj": "sé-sin-khu", "entryId": "5139"},
  {"syl": 3, "verse": "辭庫", "hanzi": "流目屎", "poj": "lâu ba̍k-sái", "distractors": ["lâu phīⁿ-chúi", "phah-kha-chhiùⁿ", "pàng-ian-hóe"], "note": "流淚、落淚。", "vHanzi": "流目屎", "vPoj": "lâu ba̍k-sái", "entryId": "5184"},
  {"syl": 3, "verse": "辭庫", "hanzi": "流鼻水", "poj": "lâu phīⁿ-chúi", "distractors": ["phah-kha-chhiùⁿ", "pàng-ian-hóe", "phah-sǹg-poâⁿ"], "note": "流鼻涕。也指傷風感冒。", "vHanzi": "流鼻水", "vPoj": "lâu phīⁿ-chúi", "entryId": "5203"},
  {"syl": 3, "verse": "辭庫", "hanzi": "拍咳啾", "poj": "phah-kha-chhiùⁿ", "distractors": ["pàng-ian-hóe", "phah-sǹg-poâⁿ", "piàⁿ-su-iâⁿ"], "note": "打噴嚏。", "vHanzi": "拍咳啾", "vPoj": "phah-kha-chhiùⁿ", "entryId": "4045"},
  {"syl": 3, "verse": "辭庫", "hanzi": "放煙火", "poj": "pàng-ian-hóe", "distractors": ["phah-sǹg-poâⁿ", "piàⁿ-su-iâⁿ", "chai-khin-tāng"], "note": "施放煙火。", "vHanzi": "放煙火", "vPoj": "pàng-ian-hóe", "entryId": "4121"},
  {"syl": 3, "verse": "辭庫", "hanzi": "拍算盤", "poj": "phah-sǹg-poâⁿ", "distractors": ["piàⁿ-su-iâⁿ", "chai-khin-tāng", "sio-chioh-m̄ng"], "note": "打算盤。用算盤計算，也用來比喻精打細算、籌畫使自己不吃虧。", "vHanzi": "拍算盤", "vPoj": "phah-sǹg-poâⁿ", "entryId": "4133"},
  {"syl": 3, "verse": "辭庫", "hanzi": "拚輸贏", "poj": "piàⁿ-su-iâⁿ", "distractors": ["chai-khin-tāng", "sio-chioh-m̄ng", "khoàⁿ-lâng-bô"], "note": "以比賽或決鬥的方式決定勝負。", "vHanzi": "拚輸贏", "vPoj": "piàⁿ-su-iâⁿ", "entryId": "4151"},
  {"syl": 3, "verse": "辭庫", "hanzi": "知輕重", "poj": "chai-khin-tāng", "distractors": ["sio-chioh-m̄ng", "khoàⁿ-lâng-bô", "khoàⁿ-bē-khí"], "note": "知道事情的輕重緩急。", "vHanzi": "知輕重", "vPoj": "chai-khin-tāng", "entryId": "4407"},
  {"syl": 3, "verse": "辭庫", "hanzi": "相借問", "poj": "sio-chioh-m̄ng", "distractors": ["khoàⁿ-lâng-bô", "khoàⁿ-bē-khí", "khoàⁿ-bô-khí"], "note": "打招呼、寒喧。互相打招呼問候。", "vHanzi": "相借問", "vPoj": "sio-chioh-m̄ng", "entryId": "5262"},
  {"syl": 3, "verse": "辭庫", "hanzi": "看人無", "poj": "khoàⁿ-lâng-bô", "distractors": ["khoàⁿ-bē-khí", "khoàⁿ-bô-khí", "khoàⁿ-ē-khí"], "note": "瞧不起人。", "vHanzi": "看人無", "vPoj": "khoàⁿ-lâng-bô", "entryId": "5318"},
  {"syl": 3, "verse": "辭庫", "hanzi": "看袂起", "poj": "khoàⁿ-bē-khí", "distractors": ["khoàⁿ-bô-khí", "khoàⁿ-ē-khí", "oàⁿ khí--lâi"], "note": "瞧不起。", "vHanzi": "看袂起", "vPoj": "khoàⁿ-bē-khí", "entryId": "5341"},
  {"syl": 3, "verse": "辭庫", "hanzi": "看無起", "poj": "khoàⁿ-bô-khí", "distractors": ["khoàⁿ-ē-khí", "oàⁿ khí--lâi", "thó-jîn-chêng"], "note": "瞧不起、看扁。", "vHanzi": "看無起", "vPoj": "khoàⁿ-bô-khí", "entryId": "5349"},
  {"syl": 3, "verse": "辭庫", "hanzi": "看會起", "poj": "khoàⁿ-ē-khí", "distractors": ["oàⁿ khí--lâi", "thó-jîn-chêng", "khí-sèng-tē"], "note": "看重、看得起；一般視為離合詞。", "vHanzi": "看會起", "vPoj": "khoàⁿ-ē-khí", "entryId": "5350"},
  {"syl": 3, "verse": "辭庫", "hanzi": "晏起來", "poj": "oàⁿ khí--lâi", "distractors": ["thó-jîn-chêng", "khí-sèng-tē", "tàu-pang-chān"], "note": "晚起、遲起。很晚才起床。", "vHanzi": "晏起來", "vPoj": "oàⁿ khí--lâi", "entryId": "6127"},
  {"syl": 3, "verse": "辭庫", "hanzi": "討人情", "poj": "thó-jîn-chêng", "distractors": ["khí-sèng-tē", "tàu-pang-chān", "chò-jîn-chêng"], "note": "要求對先前所給的恩惠予以回報。", "vHanzi": "討人情", "vPoj": "thó-jîn-chêng", "entryId": "6682"},
  {"syl": 3, "verse": "辭庫", "hanzi": "起性地", "poj": "khí-sèng-tē", "distractors": ["tàu-pang-chān", "chò-jîn-chêng", "chhoā-sin-niû"], "note": "發脾氣。因事情不如意而生氣發怒。", "vHanzi": "起性地", "vPoj": "khí-sèng-tē", "entryId": "6723"},
  {"syl": 3, "verse": "辭庫", "hanzi": "鬥幫贊", "poj": "tàu-pang-chān", "distractors": ["chò-jîn-chêng", "chhoā-sin-niû", "sioh bīn-phôe"], "note": "幫助。", "vHanzi": "鬥幫贊", "vPoj": "tàu-pang-chān", "entryId": "6890"},
  {"syl": 3, "verse": "辭庫", "hanzi": "做人情", "poj": "chò-jîn-chêng", "distractors": ["chhoā-sin-niû", "sioh bīn-phôe", "sàu thô͘-kha"], "note": "送人情、賣人情。給予他人恩惠，使人感激。", "vHanzi": "做人情", "vPoj": "chò-jîn-chêng", "entryId": "6923"},
  {"syl": 3, "verse": "辭庫", "hanzi": "娶新娘", "poj": "chhoā-sin-niû", "distractors": ["sioh bīn-phôe", "sàu thô͘-kha", "koah-tiū-á"], "note": "娶媳婦、辦喜事。", "vHanzi": "娶新娘", "vPoj": "chhoā-sin-niû", "entryId": "7116"},
  {"syl": 3, "verse": "辭庫", "hanzi": "惜面皮", "poj": "sioh bīn-phôe", "distractors": ["sàu thô͘-kha", "koah-tiū-á", "ōe-ang-á"], "note": "愛面子。愛惜自己的聲譽及顏面。", "vHanzi": "惜面皮", "vPoj": "sioh bīn-phôe", "entryId": "7253"},
  {"syl": 3, "verse": "辭庫", "hanzi": "掃塗跤", "poj": "sàu thô͘-kha", "distractors": ["koah-tiū-á", "ōe-ang-á", "hoat-sèng-tē"], "note": "掃地。", "vHanzi": "掃塗跤", "vPoj": "sàu thô͘-kha", "entryId": "7392"},
  {"syl": 3, "verse": "辭庫", "hanzi": "割稻仔", "poj": "koah-tiū-á", "distractors": ["ōe-ang-á", "hoat-sèng-tē", "tap-chhùi-kó͘"], "note": "收割稻子。", "vHanzi": "割稻仔", "vPoj": "koah-tiū-á", "entryId": "8236"},
  {"syl": 3, "verse": "辭庫", "hanzi": "畫尪仔", "poj": "ōe-ang-á", "distractors": ["hoat-sèng-tē", "tap-chhùi-kó͘", "jiá-tāi-chì"], "note": "畫圖。以畫人偶泛稱畫圖。", "vHanzi": "畫尪仔", "vPoj": "ōe-ang-á", "entryId": "8710"},
  {"syl": 3, "verse": "辭庫", "hanzi": "發性地", "poj": "hoat-sèng-tē", "distractors": ["tap-chhùi-kó͘", "jiá-tāi-chì", "ē-chò-tit"], "note": "發脾氣、發怒。", "vHanzi": "發性地", "vPoj": "hoat-sèng-tē", "entryId": "8715"},
  {"syl": 3, "verse": "辭庫", "hanzi": "答喙鼓", "poj": "tap-chhùi-kó͘", "distractors": ["jiá-tāi-chì", "ē-chò-tit", "choaⁿ io̍h-á"], "note": "鬥嘴或爭辯。", "vHanzi": "答喙鼓", "vPoj": "tap-chhùi-kó͘", "entryId": "8873"},
  {"syl": 3, "verse": "辭庫", "hanzi": "惹代誌", "poj": "jiá-tāi-chì", "distractors": ["ē-chò-tit", "choaⁿ io̍h-á", "pó͘-phoà-bāng"], "note": "惹禍、闖禍。惹是生非，引起禍端。", "vHanzi": "惹代誌", "vPoj": "jiá-tāi-chì", "entryId": "9435"},
  {"syl": 3, "verse": "辭庫", "hanzi": "會做得", "poj": "ē-chò-tit", "distractors": ["choaⁿ io̍h-á", "pó͘-phoà-bāng", "kāu-kāu-liām"], "note": "可以、可行。可以做、行得通。語氣完結時唸作ē-tsò--tit。", "vHanzi": "會做得", "vPoj": "ē-chò-tit", "entryId": "9602"},
  {"syl": 3, "verse": "辭庫", "hanzi": "煎藥仔", "poj": "choaⁿ io̍h-á", "distractors": ["pó͘-phoà-bāng", "kāu-kāu-liām", "chhì kiâm-chiáⁿ"], "note": "以水煮藥。", "vHanzi": "煎藥仔", "vPoj": "choaⁿ io̍h-á", "entryId": "9715"},
  {"syl": 3, "verse": "辭庫", "hanzi": "補破網", "poj": "pó͘-phoà-bāng", "distractors": ["kāu-kāu-liām", "chhì kiâm-chiáⁿ", "tiān-thâu-m̂ng"], "note": "修補魚網。", "vHanzi": "補破網", "vPoj": "pó͘-phoà-bāng", "entryId": "10019"},
  {"syl": 3, "verse": "辭庫", "hanzi": "詬詬唸", "poj": "kāu-kāu-liām", "distractors": ["chhì kiâm-chiáⁿ", "tiān-thâu-m̂ng", "khà tiān-ōe"], "note": "嘮嘮叨叨、囉囉嗦嗦。一直重複嘮叼不停，說來說去都是說一樣的話。", "vHanzi": "詬詬唸", "vPoj": "kāu-kāu-liām", "entryId": "10037"},
  {"syl": 3, "verse": "辭庫", "hanzi": "試鹹汫", "poj": "chhì kiâm-chiáⁿ", "distractors": ["tiān-thâu-m̂ng", "khà tiān-ōe", "soeh-to-siā"], "note": "試味道。", "vHanzi": "試鹹汫", "vPoj": "chhì kiâm-chiáⁿ", "entryId": "10049"},
  {"syl": 3, "verse": "辭庫", "hanzi": "電頭毛", "poj": "tiān-thâu-m̂ng", "distractors": ["khà tiān-ōe", "soeh-to-siā", "chhiâu sî-cheng"], "note": "燙髮。用特製的藥水在適當的溫度下使頭髮蜷曲。", "vHanzi": "電頭毛", "vPoj": "tiān-thâu-m̂ng", "entryId": "10342"},
  {"syl": 3, "verse": "辭庫", "hanzi": "敲電話", "poj": "khà tiān-ōe", "distractors": ["soeh-to-siā", "chhiâu sî-cheng", "chhiáⁿ-lâng-kheh"], "note": "打電話。", "vHanzi": "敲電話", "vPoj": "khà tiān-ōe", "entryId": "10556"},
  {"syl": 3, "verse": "辭庫", "hanzi": "說多謝", "poj": "soeh-to-siā", "distractors": ["chhiâu sî-cheng", "chhiáⁿ-lâng-kheh", "o̍h kang-hu"], "note": "道謝。用言語表示謝意。", "vHanzi": "說多謝", "vPoj": "soeh-to-siā", "entryId": "10831"},
  {"syl": 3, "verse": "辭庫", "hanzi": "撨時鐘", "poj": "chhiâu sî-cheng", "distractors": ["chhiáⁿ-lâng-kheh", "o̍h kang-hu", "thǹg-chhiah-kha"], "note": "把時鐘調整到正確的時間。", "vHanzi": "撨時鐘", "vPoj": "chhiâu sî-cheng", "entryId": "11128"},
  {"syl": 3, "verse": "辭庫", "hanzi": "請人客", "poj": "chhiáⁿ-lâng-kheh", "distractors": ["o̍h kang-hu", "thǹg-chhiah-kha", "kóng-chhiò-khoe"], "note": "請客、宴客。", "vHanzi": "請人客", "vPoj": "chhiáⁿ-lâng-kheh", "entryId": "11397"},
  {"syl": 3, "verse": "辭庫", "hanzi": "學工夫", "poj": "o̍h kang-hu", "distractors": ["thǹg-chhiah-kha", "kóng-chhiò-khoe", "lu-thâu-m̂ng"], "note": "學習技藝或武藝。", "vHanzi": "學工夫", "vPoj": "o̍h kang-hu", "entryId": "11613"},
  {"syl": 3, "verse": "辭庫", "hanzi": "褪赤跤", "poj": "thǹg-chhiah-kha", "distractors": ["kóng-chhiò-khoe", "lu-thâu-m̂ng", "tńg-toā-lâng"], "note": "打赤腳。光著腳，不穿鞋襪。", "vHanzi": "褪赤跤", "vPoj": "thǹg-chhiah-kha", "entryId": "11888"},
  {"syl": 3, "verse": "辭庫", "hanzi": "講笑詼", "poj": "kóng-chhiò-khoe", "distractors": ["lu-thâu-m̂ng", "tńg-toā-lâng", "sî thâu-lō͘"], "note": "打諢、逗笑、講笑話。", "vHanzi": "講笑詼", "vPoj": "kóng-chhiò-khoe", "entryId": "12390"},
  {"syl": 3, "verse": "辭庫", "hanzi": "攄頭毛", "poj": "lu-thâu-m̂ng", "distractors": ["tńg-toā-lâng", "sî thâu-lō͘", "khùn-tiong-tàu"], "note": "用推剪器理頭髮。", "vHanzi": "攄頭毛", "vPoj": "lu-thâu-m̂ng", "entryId": "12504"},
  {"syl": 3, "verse": "辭庫", "hanzi": "轉大人", "poj": "tńg-toā-lâng", "distractors": ["sî thâu-lō͘", "khùn-tiong-tàu", "chiò-tiān-kong"], "note": "指青春期男女身體各部位發育成熟，由小孩變成大人。", "vHanzi": "轉大人", "vPoj": "tńg-toā-lâng", "entryId": "12623"},
  {"syl": 3, "verse": "辭庫", "hanzi": "辭頭路", "poj": "sî thâu-lō͘", "distractors": ["khùn-tiong-tàu", "chiò-tiān-kong", "cháu-bô-lō͘"], "note": "辭職或解雇。", "vHanzi": "辭頭路", "vPoj": "sî thâu-lō͘", "entryId": "12892"},
  {"syl": 3, "verse": "辭庫", "hanzi": "睏中晝", "poj": "khùn-tiong-tàu", "distractors": ["chiò-tiān-kong", "cháu-bô-lō͘", "thiah-pe̍h-kóng"], "note": "午睡。中午時間的小睡。", "vHanzi": "睏中晝", "vPoj": "khùn-tiong-tàu", "entryId": "13751"},
  {"syl": 3, "verse": "辭庫", "hanzi": "照電光", "poj": "chiò-tiān-kong", "distractors": ["cháu-bô-lō͘", "thiah-pe̍h-kóng", "chia̍h-chhan-thiaⁿ"], "note": "照X光、拍X光片。", "vHanzi": "照電光", "vPoj": "chiò-tiān-kong", "entryId": "13776"},
  {"syl": 3, "verse": "辭庫", "hanzi": "走無路", "poj": "cháu-bô-lō͘", "distractors": ["thiah-pe̍h-kóng", "chia̍h-chhan-thiaⁿ", "tò-tńg--khì"], "note": "無路可逃。", "vHanzi": "走無路", "vPoj": "cháu-bô-lō͘", "entryId": "14064"},
  {"syl": 3, "verse": "辭庫", "hanzi": "拆白講", "poj": "thiah-pe̍h-kóng", "distractors": ["chia̍h-chhan-thiaⁿ", "tò-tńg--khì", "bē-tú-hó"], "note": "挑明說。", "vHanzi": "拆白講", "vPoj": "thiah-pe̍h-kóng", "entryId": "14091"},
  {"syl": 3, "verse": "辭庫", "hanzi": "食餐廳", "poj": "chia̍h-chhan-thiaⁿ", "distractors": ["tò-tńg--khì", "bē-tú-hó", "pò-hō͘-kháu"], "note": "去餐廳吃飯。", "vHanzi": "食餐廳", "vPoj": "chia̍h-chhan-thiaⁿ", "entryId": "14182"},
  {"syl": 3, "verse": "辭庫", "hanzi": "倒轉去", "poj": "tò-tńg--khì", "distractors": ["bē-tú-hó", "pò-hō͘-kháu", "ē-tit-kòe"], "note": "回去、返家。", "vHanzi": "倒轉去", "vPoj": "tò-tńg--khì", "entryId": "14188"},
  {"syl": 3, "verse": "辭庫", "hanzi": "袂拄好", "poj": "bē-tú-hó", "distractors": ["pò-hō͘-kháu", "ē-tit-kòe", "kiò tiān-ōe"], "note": "不湊巧，不方便。時間、財務等不能剛好配合得上。\n不正常、不舒服。指偏離正常出問題。", "vHanzi": "袂拄好", "vPoj": "bē-tú-hó", "entryId": "14239"},
  {"syl": 3, "verse": "辭庫", "hanzi": "報戶口", "poj": "pò-hō͘-kháu", "distractors": ["ē-tit-kòe", "kiò tiān-ōe", "kóng-sńg-chhiò"], "note": "報戶口。新生兒出生後所辦理的戶口登記。", "vHanzi": "報戶口", "vPoj": "pò-hō͘-kháu", "entryId": "14314"},
  {"syl": 3, "verse": "辭庫", "hanzi": "會得過", "poj": "ē-tit-kòe", "distractors": ["kiò tiān-ōe", "kóng-sńg-chhiò", "tńg--lâi-khì"], "note": "空間足以通過。", "vHanzi": "會得過", "vPoj": "ē-tit-kòe", "entryId": "14381"},
  {"syl": 3, "verse": "辭庫", "hanzi": "叫電話", "poj": "kiò tiān-ōe", "distractors": ["kóng-sńg-chhiò", "tńg--lâi-khì", "chhut-tāi-chì"], "note": "打電話。", "vHanzi": "叫電話", "vPoj": "kiò tiān-ōe", "entryId": "18045"},
  {"syl": 3, "verse": "辭庫", "hanzi": "講耍笑", "poj": "kóng-sńg-chhiò", "distractors": ["tńg--lâi-khì", "chhut-tāi-chì", "sio-thiàⁿ-thàng"], "note": "以言語來使人歡樂。\n以言語來作弄他人。", "vHanzi": "講耍笑", "vPoj": "kóng-sńg-chhiò", "entryId": "19597"},
  {"syl": 3, "verse": "辭庫", "hanzi": "轉來去", "poj": "tńg--lâi-khì", "distractors": ["chhut-tāi-chì", "sio-thiàⁿ-thàng", "chhut-lâi-khì"], "note": "回家。", "vHanzi": "轉來去", "vPoj": "tńg--lâi-khì", "entryId": "27291"},
  {"syl": 3, "verse": "辭庫", "hanzi": "出代誌", "poj": "chhut-tāi-chì", "distractors": ["sio-thiàⁿ-thàng", "chhut-lâi-khì", "kóng-thong-hô"], "note": "發生事故、出差錯的意思。", "vHanzi": "出代誌", "vPoj": "chhut-tāi-chì", "entryId": "27379"},
  {"syl": 3, "verse": "辭庫", "hanzi": "相疼痛", "poj": "sio-thiàⁿ-thàng", "distractors": ["chhut-lâi-khì", "kóng-thong-hô", "chò-lāu-jia̍t"], "note": "互相疼惜。", "vHanzi": "相疼痛", "vPoj": "sio-thiàⁿ-thàng", "entryId": "27444"},
  {"syl": 3, "verse": "辭庫", "hanzi": "出來去", "poj": "chhut-lâi-khì", "distractors": ["kóng-thong-hô", "chò-lāu-jia̍t", "thau-cháu-chhù"], "note": "出去。從裡面到外邊去。往外面移動。", "vHanzi": "出來去", "vPoj": "chhut-lâi-khì", "entryId": "27456"},
  {"syl": 3, "verse": "辭庫", "hanzi": "講通和", "poj": "kóng-thong-hô", "distractors": ["chò-lāu-jia̍t", "thau-cháu-chhù", "chò-tit-lâi"], "note": "彼此暗中勾結，事先串通好。", "vHanzi": "講通和", "vPoj": "kóng-thong-hô", "entryId": "27519"},
  {"syl": 3, "verse": "辭庫", "hanzi": "做鬧熱", "poj": "chò-lāu-jia̍t", "distractors": ["thau-cháu-chhù", "chò-tit-lâi", "hoah-kiù-lâng"], "note": "迎神賽會。一種廟會型式，將神像抬出廟宇上街遊行，鑼鼓喧天，場面極為熱鬧。", "vHanzi": "做鬧熱", "vPoj": "chò-lāu-jia̍t", "entryId": "28212"},
  {"syl": 3, "verse": "辭庫", "hanzi": "偷走厝", "poj": "thau-cháu-chhù", "distractors": ["chò-tit-lâi", "hoah-kiù-lâng", "âⁿ-ko͘-pêng"], "note": "蹺家。因為某種原因而離家出走。", "vHanzi": "偷走厝", "vPoj": "thau-cháu-chhù", "entryId": "28224"},
  {"syl": 3, "verse": "辭庫", "hanzi": "做得來", "poj": "chò-tit-lâi", "distractors": ["hoah-kiù-lâng", "âⁿ-ko͘-pêng", "chia̍h-lāu-pún"], "note": "自己招惹、自作自受。", "vHanzi": "做得來", "vPoj": "chò-tit-lâi", "entryId": "28360"},
  {"syl": 3, "verse": "辭庫", "hanzi": "喝救人", "poj": "hoah-kiù-lâng", "distractors": ["âⁿ-ko͘-pêng", "chia̍h-lāu-pún", "sio-tú-thâu"], "note": "呼救、大聲求救。", "vHanzi": "喝救人", "vPoj": "hoah-kiù-lâng", "entryId": "28403"},
  {"syl": 3, "verse": "辭庫", "hanzi": "攔孤爿", "poj": "âⁿ-ko͘-pêng", "distractors": ["chia̍h-lāu-pún", "sio-tú-thâu", "piàⁿ-tāng-koāⁿ"], "note": "偏袒。袒護某一方。", "vHanzi": "攔孤爿", "vPoj": "âⁿ-ko͘-pêng", "entryId": "28502"},
  {"syl": 3, "verse": "辭庫", "hanzi": "食老本", "poj": "chia̍h-lāu-pún", "distractors": ["sio-tú-thâu", "piàⁿ-tāng-koāⁿ", "thiah-phoà-bīn"], "note": "吃老本。比喻人憑恃昔日的儲蓄與本領來過日子。", "vHanzi": "食老本", "vPoj": "chia̍h-lāu-pún", "entryId": "29088"},
  {"syl": 3, "verse": "辭庫", "hanzi": "相拄頭", "poj": "sio-tú-thâu", "distractors": ["piàⁿ-tāng-koāⁿ", "thiah-phoà-bīn", "chhōe-khang-phāng"], "note": "碰頭、碰面、遇見、見面。\n相連、相接、毗鄰、鄰接。", "vHanzi": "相拄頭", "vPoj": "sio-tú-thâu", "entryId": "29157"},
  {"syl": 3, "verse": "辭庫", "hanzi": "拚重汗", "poj": "piàⁿ-tāng-koāⁿ", "distractors": ["thiah-phoà-bīn", "chhōe-khang-phāng", "seⁿ gín-á"], "note": "汗流浹背。指汗流不停。", "vHanzi": "拚重汗", "vPoj": "piàⁿ-tāng-koāⁿ", "entryId": "29771"},
  {"syl": 3, "verse": "辭庫", "hanzi": "拆破面", "poj": "thiah-phoà-bīn", "distractors": ["chhōe-khang-phāng", "seⁿ gín-á", "thó͘-toā-khùi"], "note": "撕破臉。公開爭吵，不顧對方情面。", "vHanzi": "拆破面", "vPoj": "thiah-phoà-bīn", "entryId": "29851"},
  {"syl": 3, "verse": "辭庫", "hanzi": "揣空縫", "poj": "chhōe-khang-phāng", "distractors": ["seⁿ gín-á", "thó͘-toā-khùi", "kiâⁿ-thàu-thàu"], "note": "故意挑剔，苛求責備，吹毛求疵。強調時可重疊做「揣空揣縫」。", "vHanzi": "揣空縫", "vPoj": "chhōe-khang-phāng", "entryId": "29921"},
  {"syl": 3, "verse": "辭庫", "hanzi": "生囡仔", "poj": "seⁿ gín-á", "distractors": ["thó͘-toā-khùi", "kiâⁿ-thàu-thàu", "io gín-á"], "note": "生產、分娩。生孩子。", "vHanzi": "生囡仔", "vPoj": "seⁿ gín-á", "entryId": "1886"},
  {"syl": 3, "verse": "辭庫", "hanzi": "吐大氣", "poj": "thó͘-toā-khùi", "distractors": ["kiâⁿ-thàu-thàu", "io gín-á", "cháu-sio-lia̍h"], "note": "深深的嘆息。", "vHanzi": "吐大氣", "vPoj": "thó͘-toā-khùi", "entryId": "2133"},
  {"syl": 3, "verse": "辭庫", "hanzi": "行透透", "poj": "kiâⁿ-thàu-thàu", "distractors": ["io gín-á", "cháu-sio-lia̍h", "cháu-sio-jiok"], "note": "指走遍各地方。", "vHanzi": "行透透", "vPoj": "kiâⁿ-thàu-thàu", "entryId": "2732"},
  {"syl": 3, "verse": "辭庫", "hanzi": "育囡仔", "poj": "io gín-á", "distractors": ["cháu-sio-lia̍h", "cháu-sio-jiok", "sái-sèng-tē"], "note": "養育小孩。", "vHanzi": "育囡仔", "vPoj": "io gín-á", "entryId": "3358"},
  {"syl": 3, "verse": "辭庫", "hanzi": "走相掠", "poj": "cháu-sio-lia̍h", "distractors": ["cháu-sio-jiok", "sái-sèng-tē", "khek-ìn-á"], "note": "你跑我追、被抓到的當鬼的遊戲。", "vHanzi": "走相掠", "vPoj": "cháu-sio-lia̍h", "entryId": "3440"},
  {"syl": 3, "verse": "辭庫", "hanzi": "走相逐", "poj": "cháu-sio-jiok", "distractors": ["sái-sèng-tē", "khek-ìn-á", "khuh-khuh-sàu"], "note": "賽跑。\n你跑我追、互相追逐的遊戲。", "vHanzi": "走相逐", "vPoj": "cháu-sio-jiok", "entryId": "3441"},
  {"syl": 3, "verse": "辭庫", "hanzi": "使性地", "poj": "sái-sèng-tē", "distractors": ["khek-ìn-á", "khuh-khuh-sàu", "kho͘-uh-á"], "note": "使性子、耍脾氣。", "vHanzi": "使性地", "vPoj": "sái-sèng-tē", "entryId": "3551"},
  {"syl": 3, "verse": "辭庫", "hanzi": "刻印仔", "poj": "khek-ìn-á", "distractors": ["khuh-khuh-sàu", "kho͘-uh-á", "kho͘-si-á"], "note": "刻章、刻印。雕刻印章。", "vHanzi": "刻印仔", "vPoj": "khek-ìn-á", "entryId": "3628"},
  {"syl": 3, "verse": "辭庫", "hanzi": "呿呿嗽", "poj": "khuh-khuh-sàu", "distractors": ["kho͘-uh-á", "kho͘-si-á", "phēⁿ-phēⁿ-chhoán"], "note": "咳個不停。", "vHanzi": "呿呿嗽", "vPoj": "khuh-khuh-sàu", "entryId": "3714"},
  {"syl": 3, "verse": "辭庫", "hanzi": "呼噎仔", "poj": "kho͘-uh-á", "distractors": ["kho͘-si-á", "phēⁿ-phēⁿ-chhoán", "phah-m̄-kìⁿ"], "note": "連續打嗝、打氣嗝。指因食道抽搐造成的連續打嗝。", "vHanzi": "呼噎仔", "vPoj": "kho͘-uh-á", "entryId": "3743"},
  {"syl": 3, "verse": "辭庫", "hanzi": "呼噓仔", "poj": "kho͘-si-á", "distractors": ["phēⁿ-phēⁿ-chhoán", "phah-m̄-kìⁿ", "piàⁿ-seng-lí"], "note": "吹口哨。", "vHanzi": "呼噓仔", "vPoj": "kho͘-si-á", "entryId": "3744"},

// 自動解析白話字音節結構與連讀變調規則
function detectPojTone(rawSyl) {
  const nfd = rawSyl.normalize('NFD');
  if (/\u0301/.test(nfd)) return 2;
  if (/\u0300/.test(nfd)) return 3;
  if (/\u0302/.test(nfd)) return 5;
  if (/\u0304/.test(nfd)) return 7;
  if (/\u030d/.test(nfd)) return 8;
  const clean = rawSyl.replace(/ⁿ$/i, '');
  if (/[ptkh]$/i.test(clean)) return 4;
  return 1;
}

function buildAutoParts(poj, hanzi) {
  const tokens = poj.split(/(--|-)/);
  const syls = [];
  let afterDoubleHyphen = false;

  for (let i = 0; i < tokens.length; i += 2) {
    const raw = tokens[i];
    const prevSep = i > 0 ? tokens[i - 1] : null;
    const nextSep = i + 1 < tokens.length ? tokens[i + 1] : null;

    if (prevSep === '--') afterDoubleHyphen = true;

    let displayP = raw;
    if (prevSep === '--') displayP = '--' + displayP;
    if (nextSep === '-') displayP = displayP + '-';

    let type = 'base';
    if (afterDoubleHyphen) {
      type = 'neutral';
    } else if (nextSep === '-') {
      type = 'sandhi';
    } else {
      type = 'base';
    }

    const tone = detectPojTone(raw);
    const isH = /hⁿ?$/i.test(raw);
    let rule = '';

    if (type === 'neutral') {
      rule = '輕聲';
    } else if (type === 'base') {
      rule = `${tone}調（本調）`;
    } else {
      if (tone === 1) rule = '1調 ➔ 變7調';
      else if (tone === 2) rule = '2調 ➔ 變1調';
      else if (tone === 3) rule = '3調 ➔ 變2調';
      else if (tone === 5) rule = '5調 ➔ 變7調';
      else if (tone === 7) rule = '7調 ➔ 變3調';
      else if (tone === 4) rule = isH ? '4調(-h) ➔ 變2調' : '4調 ➔ 變8調';
      else if (tone === 8) rule = isH ? '8調(-h) ➔ 變3調' : '8調 ➔ 變4調';
    }

    syls.push({ p: displayP, h: '', rule, type, tone });
  }

  const chars = Array.from(hanzi);
  syls.forEach((s, idx) => {
    s.h = chars[idx] || hanzi;
  });

  return syls;
}

function processRawDB(rawList) {
  return rawList.map(item => {
    const chNum = parseInt(String(item.verse).split(':')[0], 10) || 1;
    const parts = item.parts || buildAutoParts(item.poj, item.hanzi);
    const sylNum = Number(item.syl) || parts.length;
    const feature = item.feature || parts.map(pt => pt.rule).join(' ＋ ');
    return { ...item, syl: sylNum, ch: chNum, parts, feature };
  });
}

// 通用陣列徹底隨機洗牌函式 (Fisher-Yates Shuffle)
function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

// 隨機挑選下一個不與目前重複的索引（確保每次跳動都是隨機經節）
function pickRandomNextIndex(currentIdx, length) {
  if (length <= 1) return 0;
  let next = Math.floor(Math.random() * length);
  while (next === currentIdx) {
    next = Math.floor(Math.random() * length);
  }
  return next;
}

// 判斷是否為「第 4、8 音（入聲）字詞」
function isTone48Word(item) {
  if (/[48]調|入聲/.test(item.feature)) return true;
  return item.parts.some(pt => {
    const cleanSyl = pt.p.replace(/^-+|-+$/g, '');
    return /[48]調/.test(pt.rule) || /[ptkh]ⁿ?$/i.test(cleanSyl);
  });
}

function changeSpeed(val) {
  if (val !== undefined) {
    speedSec = parseInt(val, 10);
  }
  document.querySelectorAll('.speed-select').forEach(sel => {
    sel.value = String(speedSec);
  });
  restartAutoTimer();
}

function restartAutoTimer() {
  if (autoTimerId) clearInterval(autoTimerId);
  if (writingHoldTimer) { clearTimeout(writingHoldTimer); writingHoldTimer = null; }
  autoTimerDueAt = Date.now() + speedSec * 1000;
  autoTimerId = setInterval(() => {
    autoTimerDueAt = Date.now() + speedSec * 1000;
    if (currentView === 'card') {
      nextCard();
    } else if (currentView === 'quiz') {
      nextQuiz();
    } else if (currentView === 'grid') {
      // 依所選秒速重新隨機排列詞庫，保留目前的遮字／點擊顯示狀態。
      shuffleGridDisplay();
    }
  }, speedSec * 1000);
}

  Object.entries(ids).forEach(([name,id]) => {
    const el = document.getElementById(id);

    el.setAttribute("aria-pressed", String(currentBookName === name));

  currentBookName = bookName;
  updateBookTabs();
  // 點選「名詞」、「動詞」或「形容詞」時，載入對應語料庫並立即隨機洗牌
  applyFilters();
}

function setViewMode(mode) {
  currentView = mode;
  ['card', 'quiz', 'grid'].forEach(m => {
    document.getElementById('view-' + m).classList.toggle('hidden', m !== mode);
    document.getElementById('vtab-' + m).classList.toggle('active', m === mode);
  });
  // 點選任一檢視模式時，皆重新隨機洗牌並隨機抽題
  activeDeck = shuffleArray(activeDeck);
  cardIdx = Math.floor(Math.random() * activeDeck.length);
  quizIdx = Math.floor(Math.random() * activeDeck.length);
  isFlipped = false;
  restartAutoTimer();
  renderAll();
}

function getFilteredDeck() {
  const pool = BOOK_DB_MAP[currentBookName] || BOOK_DB_MAP['名詞'];

  if (currentSyl === 'all') {
    return shuffleArray(pool);
  }

  if (currentSyl === '48') {
    return shuffleArray(pool.filter(item => isTone48Word(item)));
  }

  return shuffleArray(pool.filter(item => item.syl === Number(currentSyl)));
}

function applyFilters() {
  activeDeck = getFilteredDeck();

  // 所有選項一律隨機洗牌並隨機選取起始題
  activeDeck = shuffleArray(activeDeck);
  cardIdx = activeDeck.length ? Math.floor(Math.random() * activeDeck.length) : 0;
  isFlipped = false;
  quizIdx = activeDeck.length ? Math.floor(Math.random() * activeDeck.length) : 0;
  quizCorrect = 0;
  quizDoneSet.clear();
  restartAutoTimer();
  renderAll();
}

function renderAll() {
  if (currentView === 'card') renderFlashcard();
  if (currentView === 'quiz') renderQuiz();
  if (currentView === 'grid') renderGrid();
}

let flashcardMask = 'none';
function setFlashcardMask(mask) {
  if (!['none','poj','hanzi','write'].includes(mask)) return;
  flashcardMask = mask;
  writingAnswerRevealed = false;
  // 每次按下「寫作測試」都立即隨機抽出新題，不沿用上一題或倒數剩餘時間。
  if (mask === 'write' && activeDeck.length > 0) {
    cardIdx = pickRandomNextIndex(cardIdx, activeDeck.length);
    isFlipped = false;
    // 即使詞庫只有一筆資料，也重設輸入區及答題狀態。
    lastRenderedCardKey = null;
  }
  // 以調整速度選取的完整秒數，從此刻重新開始倒數。
  restartAutoTimer();
  ['none','poj','hanzi','write'].forEach(m => {
    const button = document.getElementById('fmask-' + m);
    button.classList.toggle('active', m === mask);
    button.setAttribute('aria-pressed', String(m === mask));
  });
  const entry = document.getElementById('poj-keyboard-entry');
  if (entry) {
    const isWriting = mask === 'write';
    entry.disabled = !isWriting;
    entry.setAttribute('aria-disabled', String(!isWriting));
    entry.placeholder = isWriting ? '在此輸入白話字' : '';
    entry.value = '';
    if (isWriting) entry.focus();
    else entry.blur();
    const keyboard = document.getElementById('poj-tone-keyboard');
    if (keyboard) {
      keyboard.classList.toggle('poj-keyboard-inactive', !isWriting);
      keyboard.querySelectorAll('button').forEach(button => { button.disabled = !isWriting; });
    }
  }
  const msg = document.getElementById('fc-write-feedback');
  if (msg) msg.textContent = '';
  renderFlashcard();
}
function applyFlashcardMask() {
  const hanziEl = direction === 'h2p' ? document.getElementById('fc-front-word') : document.getElementById('fc-second-word');
  const pojEl = direction === 'h2p' ? document.getElementById('fc-second-word') : document.getElementById('fc-front-word');
  hanziEl.classList.remove('fc-poj-enlarged');
  pojEl.classList.add('fc-poj-enlarged');
  hanziEl.classList.add('fc-hanzi-horizontal');
  pojEl.classList.add('fc-poj-horizontal');
  hanziEl.classList.remove('fc-poj-horizontal');
  pojEl.classList.remove('fc-hanzi-horizontal');
  [[hanziEl, 'hanzi'], [pojEl, 'poj']].forEach(([el, type]) => {
    const hidden = flashcardMask === type || (flashcardMask === 'write' && type === 'poj' && !writingAnswerRevealed);
    el.classList.toggle('fc-word-masked', hidden);
    el.setAttribute('aria-label', hidden ? '點擊顯示答案' : el.textContent);
    el.tabIndex = hidden ? 0 : -1;
    el.onclick = hidden ? function(event) {
      event.stopPropagation(); // 顯示答案時不要同時翻卡
      el.classList.remove('fc-word-masked');
      el.setAttribute('aria-label', el.textContent);
    } : null;
    el.onkeydown = hidden ? function(event) {
      if (event.key === 'Enter') { event.preventDefault(); event.stopPropagation(); el.click(); }
    } : null;
  });
}

/* ================= 1. 閃卡模式 ================= */
function setDirection(dir) {
  direction = dir;
  isFlipped = false;
  document.getElementById('dir-h2p').classList.toggle('active', dir === 'h2p');
  document.getElementById('dir-p2h').classList.toggle('active', dir === 'p2h');
  cardIdx = pickRandomNextIndex(cardIdx, activeDeck.length);
  renderFlashcard();
}

function shuffleDeck() {
  activeDeck = shuffleArray(activeDeck);
  cardIdx = pickRandomNextIndex(cardIdx, activeDeck.length);
  isFlipped = false;
  restartAutoTimer();
  renderAll();
}

function highlightTarget(sentence, target) {
  if (!sentence || !target) return sentence;
  const escaped = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(escaped, 'i');
  return sentence.replace(regex, match => `<span class="hl-word">${match}</span>`);
}

function renderFlashcard() {
  const item = activeDeck[cardIdx];
  if (!item) {
    document.getElementById('fc-front-word').textContent = '目前沒有符合條件的字詞';
    document.getElementById('fc-second-word').textContent = '請選擇「全部字詞」';
    return;
  }

  // 換題時清空上一題的手寫內容與答對狀態；同一題重繪則保留。
  const renderedKey = getKey(item);
  if (lastRenderedCardKey !== renderedKey) {
    lastRenderedCardKey = renderedKey;
    writingAnswerRevealed = false;
    const input = document.getElementById('poj-keyboard-entry');
    if (input) input.value = '';
    const feedback = document.getElementById('fc-write-feedback');
    if (feedback) feedback.textContent = '';
  }

  // 第三列顯示「聖經出處章節」（隨機顯示）
  document.getElementById('fc-verse').textContent = `${currentBookName} ${item.verse}`;

  const frontWord = document.getElementById('fc-front-word');
  const secondWord = document.getElementById('fc-second-word');

  // 第四列同時顯示「漢字」與「白話字」
  if (direction === 'h2p') {
    frontWord.textContent = item.hanzi;
    secondWord.textContent = item.poj;
  } else {
    frontWord.textContent = item.poj;
    secondWord.textContent = item.hanzi;
  }
  applyFlashcardMask();

function renderPojToneRule(rule) {
  return String(rule || '').replace(/([1234578])調/g, (match, tone) => {
    const src = POJ_TONE_ICONS[tone];
    return src ? `<img class="tone-symbol" src="${src}" alt="${match}" title="${match}">` : match;
  });
}
